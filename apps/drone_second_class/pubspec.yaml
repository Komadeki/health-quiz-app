name: drone_second_class
description: Production study app for the drone second-class knowledge exam.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  qualification_app:
    path: ../../packages/qualification_app
  quiz_engine:
    path: ../../packages/quiz_engine
  share_plus: ^11.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/question_bank/drone_second_class_bank.json
