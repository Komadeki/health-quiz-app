name: Drone App Store Release Prep

on:
  push:
    branches:
      - chatgpt/drone-testflight-preview-current
    paths:
      - '.github/drone-asc-release-prep-trigger'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BUNDLE_ID: com.komadeki.dronesecondclass
      TARGET_VERSION: '1.0.1'
      LEGACY_DRAFT_VERSION: '1.0'
      BUILD_NUMBER: '202608261144'
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Prepare App Store version and build
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m pip install --quiet pyjwt cryptography
          export ASC_KEY_PATH="$KEY_PATH"
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, jwt

          with open(os.environ['ASC_KEY_PATH'], encoding='utf-8') as fh:
              private_key = fh.read()
          key_id = os.environ['APP_STORE_CONNECT_API_KEY_ID']
          issuer_id = os.environ['APP_STORE_CONNECT_API_ISSUER_ID']
          bundle_id = os.environ['APP_BUNDLE_ID']
          target_version = os.environ['TARGET_VERSION']
          legacy_version = os.environ['LEGACY_DRAFT_VERSION']
          build_number = os.environ['BUILD_NUMBER']

          def token():
              now = int(time.time())
              return jwt.encode({'iss': issuer_id, 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'}, private_key, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'})

          def request(method, path, params=None, body=None, optional=False):
              url = 'https://api.appstoreconnect.apple.com' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params, doseq=True)
              data = None if body is None else json.dumps(body).encode('utf-8')
              headers = {'Authorization': 'Bearer ' + token()}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      raw = res.read()
                      if not raw:
                          return None
                      return json.loads(raw)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  if optional:
                      print(f'OPTIONAL_API_UNAVAILABLE={method} {path} HTTP {exc.code}')
                      return None
                  print(f'HTTP {exc.code} for {method} {path}: {raw}', file=sys.stderr)
                  raise

          apps = request('GET', '/v1/apps', {'filter[bundleId]': bundle_id, 'limit': 1})
          if not apps.get('data'):
              print('::error::App not found'); sys.exit(1)
          app = apps['data'][0]
          app_id = app['id']
          print('APP_ID=' + app_id)

          builds = request('GET', '/v1/builds', {'filter[app]': app_id, 'filter[version]': build_number, 'limit': 10})
          if not builds.get('data'):
              print('::error::RC build not found'); sys.exit(1)
          build = builds['data'][0]
          build_id = build['id']
          ba = build.get('attributes', {})
          print('BUILD_ID=' + build_id)
          print('BUILD_PROCESSING_STATE=' + str(ba.get('processingState')))
          print('BUILD_EXPIRED=' + str(ba.get('expired')))
          if ba.get('processingState') != 'VALID' or ba.get('expired') is True:
              print('::error::RC build is not valid'); sys.exit(1)

          versions = request('GET', f'/v1/apps/{app_id}/appStoreVersions', {'limit': 200})
          target = None
          legacy = None
          for item in versions.get('data', []):
              a = item.get('attributes', {})
              ver = a.get('versionString')
              state = a.get('appVersionState') or a.get('appStoreState')
              print('FOUND_VERSION=' + str(ver) + ' STATE=' + str(state) + ' ID=' + item['id'])
              if ver == target_version:
                  target = item
              if ver == legacy_version and state == 'PREPARE_FOR_SUBMISSION':
                  legacy = item

          if target is None:
              if legacy is None:
                  print('::error::No editable target or legacy draft version found'); sys.exit(1)
              version_id = legacy['id']
              body = {'data': {'type': 'appStoreVersions', 'id': version_id, 'attributes': {'versionString': target_version}}}
              updated = request('PATCH', f'/v1/appStoreVersions/{version_id}', body=body)
              target = updated['data']
              print('VERSION_NUMBER_UPDATED=' + str(target.get('attributes', {}).get('versionString')))
          else:
              version_id = target['id']
              print('VERSION_NUMBER_ALREADY_TARGET=true')

          current_build = request('GET', f'/v1/appStoreVersions/{version_id}/build', optional=True)
          current_id = current_build.get('data', {}).get('id') if current_build else None
          if current_id != build_id:
              request('PATCH', f'/v1/appStoreVersions/{version_id}/relationships/build', body={'data': {'type': 'builds', 'id': build_id}})
              print('BUILD_ATTACHED_TO_VERSION=true')
          else:
              print('BUILD_ALREADY_ATTACHED=true')

          version = request('GET', f'/v1/appStoreVersions/{version_id}', {'include': 'build,appStoreReviewDetail,appStoreVersionLocalizations'})
          va = version['data'].get('attributes', {})
          print('VERSION_ID=' + version_id)
          print('VERSION_STRING=' + str(va.get('versionString')))
          print('VERSION_STATE=' + str(va.get('appVersionState') or va.get('appStoreState')))
          print('RELEASE_TYPE=' + str(va.get('releaseType')))

          attached = request('GET', f'/v1/appStoreVersions/{version_id}/build')
          print('VERSION_BUILD_MATCHES_RC=' + str(attached.get('data', {}).get('id') == build_id).lower())

          locs = request('GET', f'/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations', {'limit': 200}, optional=True)
          loc_count = 0
          screenshot_total = 0
          if locs:
              for loc in locs.get('data', []):
                  loc_count += 1
                  la = loc.get('attributes', {})
                  locale = str(la.get('locale'))
                  print('LOCALIZATION=' + locale
                        + ' DESCRIPTION=' + str(bool((la.get('description') or '').strip())).lower()
                        + ' KEYWORDS=' + str(bool((la.get('keywords') or '').strip())).lower()
                        + ' SUPPORT_URL=' + str(la.get('supportUrl')))
                  sets = request('GET', f"/v1/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets", {'limit': 200}, optional=True)
                  if sets:
                      for shot_set in sets.get('data', []):
                          shots = request('GET', f"/v1/appScreenshotSets/{shot_set['id']}/appScreenshots", {'limit': 200}, optional=True)
                          count = len(shots.get('data', [])) if shots else 0
                          screenshot_total += count
                          print('SCREENSHOT_SET=' + locale + ':' + str(shot_set.get('attributes', {}).get('screenshotDisplayType')) + ' COUNT=' + str(count))
          print('LOCALIZATION_COUNT=' + str(loc_count))
          print('SCREENSHOT_TOTAL=' + str(screenshot_total))

          review = request('GET', f'/v1/appStoreVersions/{version_id}/appStoreReviewDetail', optional=True)
          if review and review.get('data'):
              ra = review['data'].get('attributes', {})
              print('REVIEW_DETAIL_EXISTS=true')
              print('REVIEW_CONTACT_EMAIL_PRESENT=' + str(bool((ra.get('contactEmail') or '').strip())).lower())
              print('REVIEW_CONTACT_PHONE_PRESENT=' + str(bool((ra.get('contactPhone') or '').strip())).lower())
              print('REVIEW_DEMO_REQUIRED=' + str(ra.get('demoAccountRequired')))
          else:
              print('REVIEW_DETAIL_EXISTS=false')

          infos = request('GET', f'/v1/apps/{app_id}/appInfos', {'limit': 50}, optional=True)
          if infos:
              for info in infos.get('data', []):
                  ia = info.get('attributes', {})
                  print('APP_INFO_STATE=' + str(ia.get('state') or ia.get('appStoreState')) + ' ID=' + info['id'])
                  ilocs = request('GET', f"/v1/appInfos/{info['id']}/appInfoLocalizations", {'limit': 200}, optional=True)
                  if ilocs:
                      for iloc in ilocs.get('data', []):
                          la = iloc.get('attributes', {})
                          print('APP_INFO_LOCALIZATION=' + str(la.get('locale')) + ' PRIVACY_URL=' + str(la.get('privacyPolicyUrl')))

          iaps = request('GET', f'/v1/apps/{app_id}/inAppPurchasesV2', {'limit': 200}, optional=True)
          if iaps:
              for iap in iaps.get('data', []):
                  ia = iap.get('attributes', {})
                  print('IAP_PRODUCT_ID=' + str(ia.get('productId')) + ' TYPE=' + str(ia.get('inAppPurchaseType')) + ' STATE=' + str(ia.get('state')))
          PY
