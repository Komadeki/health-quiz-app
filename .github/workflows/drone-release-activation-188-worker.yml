name: Drone Production Bank 188 Release Activation Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/drone-release-activation-188-trigger'

permissions:
  contents: write

concurrency:
  group: drone-release-activation-188-worker
  cancel-in-progress: false

jobs:
  activate:
    if: github.head_ref == 'chatgpt/drone-release-activate-188'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-release-activate-188
          fetch-depth: 0

      - name: Reconcile to authoritative current main
        shell: bash
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Execute atomic Production Bank 188 activation
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import subprocess
          import sys
          from pathlib import Path

          repo = Path.cwd()
          bank_root = repo / "question_banks" / "drone_second_class"
          authoring = bank_root / "authoring"
          tool_dir = repo / "tooling" / "question_bank"
          sys.path.insert(0, str(tool_dir))

          from contract import load_bank_inputs, pretty_json_bytes
          from expansion import validate_expansion_batch
          from generation import build_released_questions_document, write_generated_files
          from validation import validate_bank

          activation_path = authoring / "release_activation_188.json"
          activation = json.loads(activation_path.read_text(encoding="utf-8"))
          release_id = "drone-second-class-v2-release-2026-08-24"
          expansion_ids = [f"DRONE-Q-{n:06d}" for n in range(101, 189)]
          expansion_set = set(expansion_ids)
          all_ids = [f"DRONE-Q-{n:06d}" for n in range(1, 189)]
          historical_ids = set(all_ids[:100])

          # Fail closed on the persisted release gate and every SHA-bound input.
          if activation.get("activation_id") != "DRONE-PRODUCTION-BANK-188-RELEASE-ACTIVATION":
              raise SystemExit("unexpected activation contract")
          selection = activation.get("release_selection", {})
          if selection.get("canonical_question_count") != 188 or selection.get("activation_question_count") != 88:
              raise SystemExit("release selection drift")
          if activation.get("planned_release_identity", {}).get("bank_revision") != release_id:
              raise SystemExit("planned release identity drift")
          for path, expected_blob in activation.get("baseline_bindings", {}).items():
              actual_blob = subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f"bound input drift: {path}: {actual_blob} != {expected_blob}")

          state_path = repo / "tooling" / "komadeki_autopilot" / "drone_state.json"
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("status") != "ACTIVE" or state.get("current_phase") != "QUESTION_BANK_COMPLETION":
              raise SystemExit("unexpected Drone phase/status")
          if state.get("state_epoch") != 25 or state.get("next_atomic_objective") != "EXECUTE_PRODUCTION_BANK_188_RELEASE_ACTIVATION":
              raise SystemExit("unexpected Drone epoch/objective")
          if state.get("human_blocker") is not None:
              raise SystemExit("unexpected human blocker")

          target = json.loads((authoring / "target_review_188.json").read_text(encoding="utf-8"))
          adopted = target.get("adopted_decisions", {})
          if target.get("canonical_inventory") != 188 or adopted.get("final_production_target") != 188 or adopted.get("target_status") != "FROZEN" or adopted.get("expansion") != "STOP":
              raise SystemExit("target review no longer freezes STOP at 188")

          def read_csv(path: Path):
              with path.open(encoding="utf-8", newline="") as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), list(reader)

          def write_csv(path: Path, fields, rows):
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields, lineterminator="\n")
                  writer.writeheader(); writer.writerows(rows)

          q_path = authoring / "questions.csv"
          q_fields, questions = read_csv(q_path)
          q_by_id = {row["question_id"]: row for row in questions}
          if len(q_by_id) != 188 or set(q_by_id) != set(all_ids):
              raise SystemExit("canonical ID inventory must be exactly Q1..Q188")
          historical_questions_before = {qid: dict(q_by_id[qid]) for qid in historical_ids}
          expansion_questions_before = {qid: dict(q_by_id[qid]) for qid in expansion_ids}
          if any(q_by_id[qid]["status"] != "active" for qid in historical_ids):
              raise SystemExit("historical Q1..Q100 active invariant failed")
          if any(q_by_id[qid]["status"] != "draft" for qid in expansion_ids):
              raise SystemExit("Q101..Q188 must all be draft before activation")
          if any(q_by_id[qid]["is_free"] != "false" for qid in expansion_ids):
              raise SystemExit("expansion free-selection invariant failed")

          r_path = authoring / "question_id_registry.csv"
          r_fields, registry = read_csv(r_path)
          r_by_id = {row["question_id"]: row for row in registry}
          if not set(all_ids).issubset(r_by_id):
              raise SystemExit("registry missing permanent IDs")
          historical_registry_before = {qid: dict(r_by_id[qid]) for qid in historical_ids}
          if any(r_by_id[qid]["status"] != "used" or not r_by_id[qid]["first_used_bank_revision"] for qid in historical_ids):
              raise SystemExit("historical registry release identity missing")
          if any(r_by_id[qid]["status"] != "used" or r_by_id[qid]["first_used_bank_revision"] for qid in expansion_ids):
              raise SystemExit("expansion registry must be used with blank first-use revision")

          released_path = authoring / "released_questions.json"
          released_before = json.loads(released_path.read_text(encoding="utf-8"))["released_questions"]
          if [row["question_id"] for row in released_before] != all_ids[:100]:
              raise SystemExit("historical released snapshot must be exact Q1..Q100")

          source_doc = json.loads((authoring / "source_verifications.json").read_text(encoding="utf-8"))
          verification_ids = {row["question_id"] for row in source_doc.get("verifications", [])}
          if not expansion_set.issubset(verification_ids):
              raise SystemExit("not all expansion questions are source verified")

          batch_dirs = [authoring / "batches" / f"batch_{n:03d}" for n in range(1, 5)]
          mapped_candidates = {}
          batch_payloads = []
          for batch in batch_dirs:
              errors = validate_expansion_batch(batch)
              if errors:
                  raise SystemExit(f"pre-activation batch validation failed {batch.name}: {' | '.join(errors)}")
              fields, rows = read_csv(batch / "candidates.csv")
              for row in rows:
                  qid = row["permanent_question_id"]
                  if qid in expansion_set:
                      if row["state"] != "VERIFIED":
                          raise SystemExit(f"selected candidate not VERIFIED: {row['candidate_id']}")
                      if qid in mapped_candidates:
                          raise SystemExit(f"duplicate candidate mapping: {qid}")
                      mapped_candidates[qid] = row["candidate_id"]
              batch_payloads.append((batch, fields, rows))
          if set(mapped_candidates) != expansion_set:
              raise SystemExit(f"selected candidate mapping must be exact 88, got {len(mapped_candidates)}")

          pre = validate_bank(bank_root, check_generated=False)
          if not pre.is_valid:
              raise SystemExit("pre-activation canonical validation failed: " + " | ".join(str(i) for i in pre.errors))

          generated_before = (bank_root / "generated/drone_second_class_bank.json").read_bytes()
          app_asset = repo / "apps/drone_second_class/assets/question_bank/drone_second_class_bank.json"
          if app_asset.read_bytes() != generated_before:
              raise SystemExit("pre-activation generated/app asset mismatch")

          # Atomic staged mutations: canonical, registry, release snapshot, bank identity, runtime, candidates.
          for qid in expansion_ids:
              q_by_id[qid]["status"] = "active"
              q_by_id[qid]["last_reviewed_at"] = "2026-08-24"
          write_csv(q_path, q_fields, questions)

          for qid in expansion_ids:
              r_by_id[qid]["first_used_bank_revision"] = release_id
          write_csv(r_path, r_fields, registry)

          bank_path = authoring / "bank.json"
          bank = json.loads(bank_path.read_text(encoding="utf-8"))
          bank["bank_revision"] = release_id
          bank["content_as_of"] = "2026-08-24"
          bank_path.write_text(json.dumps(bank, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          inputs = load_bank_inputs(bank_root)
          released_after_doc = build_released_questions_document(inputs)
          released_after = released_after_doc["released_questions"]
          if len(released_after) != 188 or released_after[:100] != released_before:
              raise SystemExit("release snapshot extension would rewrite historical Q1..Q100 identity")
          released_path.write_bytes(pretty_json_bytes(released_after_doc))

          mid = validate_bank(bank_root, check_generated=False)
          if not mid.is_valid:
              raise SystemExit("staged canonical validation failed: " + " | ".join(str(i) for i in mid.errors))
          list(write_generated_files(bank_root))
          generated_path = bank_root / "generated/drone_second_class_bank.json"
          app_asset.write_bytes(generated_path.read_bytes())

          for batch, fields, rows in batch_payloads:
              for row in rows:
                  if row["permanent_question_id"] in expansion_set:
                      row["state"] = "RELEASED"
              write_csv(batch / "candidates.csv", fields, rows)

          # Historical contracts must remain byte-semantically unchanged except explicitly permitted metadata.
          _, questions_after = read_csv(q_path)
          q_after = {row["question_id"]: row for row in questions_after}
          for qid in historical_ids:
              if q_after[qid] != historical_questions_before[qid]:
                  raise SystemExit(f"historical canonical question changed: {qid}")
          for qid in expansion_ids:
              before = expansion_questions_before[qid]
              after = q_after[qid]
              for field in q_fields:
                  expected = "active" if field == "status" else "2026-08-24" if field == "last_reviewed_at" else before[field]
                  if after[field] != expected:
                      raise SystemExit(f"unexpected canonical mutation {qid}:{field}")
          _, registry_after = read_csv(r_path)
          reg_after = {row["question_id"]: row for row in registry_after}
          for qid in historical_ids:
              if reg_after[qid] != historical_registry_before[qid]:
                  raise SystemExit(f"historical registry changed: {qid}")

          # Durable release facts.
          readme_path = bank_root / "README.md"
          readme = readme_path.read_text(encoding="utf-8")
          start = readme.index("## Release state")
          end = readme.index("## Validation snapshot identity")
          release_section = '''## Release state\n\n- 188 / 188 canonical questions are Production active and released.\n- Production bank revision: `drone-second-class-v2-release-2026-08-24`.\n- Production runtime: 188 active questions, 20 free, and 168 premium.\n- Free selection remains the original 20 permanent IDs; the 88 expansion questions remain premium.\n- `DRONE-Q-000001..DRONE-Q-000100` preserve their original first-use revision `drone-second-class-v1-release-2026-08-20`.\n- `DRONE-Q-000101..DRONE-Q-000188` record first use in `drone-second-class-v2-release-2026-08-24`.\n- `DRONE-Q-000189` and later IDs remain unreserved.\n- Broad Question Bank expansion is STOP; the source/coverage-driven Production target is FROZEN at 188.\n\n'''
          readme = readme[:start] + release_section + readme[end:]
          readme = readme.replace(
              "Production release v1 activates the existing 100 questions without changing\ntheir question content or permanent identities.",
              "Production release v2 activates the complete 188-question canonical bank without changing\nquestion content or permanent identities."
          )
          old_registry = '''The registry uses the existing `used` status. Every current ID records\n`drone-second-class-v1-release-2026-08-20` in\n`first_used_bank_revision`. IDs beyond `DRONE-Q-000100` are not reserved.'''
          new_registry = '''The registry uses the existing `used` status. `DRONE-Q-000001..DRONE-Q-000100`\npreserve `drone-second-class-v1-release-2026-08-20` in `first_used_bank_revision`;\n`DRONE-Q-000101..DRONE-Q-000188` record\n`drone-second-class-v2-release-2026-08-24`. IDs beyond `DRONE-Q-000188` are not reserved.'''
          readme = readme.replace(old_registry, new_registry)
          readme = readme.replace(
              "No question IDs beyond `DRONE-Q-000100` are allocated or reserved.",
              "Expansion IDs `DRONE-Q-000101..DRONE-Q-000188` are allocated and released; `DRONE-Q-000189` and later remain unreserved."
          )
          readme_path.write_text(readme, encoding="utf-8")

          # Update lifecycle assertions that intentionally described the pre-release state.
          p = tool_dir / "tests/test_b1_source_verification.py"
          t = p.read_text(encoding="utf-8").replace("test_b1_rules_are_verified_without_release_activation", "test_b1_rules_are_released_after_verified_activation").replace('self.assertEqual("VERIFIED", rows[candidate_id]["state"])', 'self.assertEqual("RELEASED", rows[candidate_id]["state"])').replace('self.assertEqual(100, len(released))', 'self.assertEqual(188, len(released))')
          p.write_text(t, encoding="utf-8")

          p = tool_dir / "tests/test_b4_source_verification.py"
          t = p.read_text(encoding="utf-8").replace('rows[cid]["state"] == "VERIFIED"', 'rows[cid]["state"] == "RELEASED"').replace('self.assertEqual(100, len(released))', 'self.assertEqual(188, len(released))')
          p.write_text(t, encoding="utf-8")

          p = tool_dir / "tests/test_b4_integration.py"
          t = p.read_text(encoding="utf-8")
          t = t.replace('self.assertIn(candidate["state"], {"INTEGRATED", "VERIFIED"})', 'self.assertEqual("RELEASED", candidate["state"])')
          t = t.replace('self.assertEqual("draft", question["status"])', 'self.assertEqual("active", question["status"])')
          t = t.replace('self.assertEqual("", question["last_reviewed_at"])', 'self.assertEqual("2026-08-24", question["last_reviewed_at"])')
          t = t.replace('self.assertEqual("", registry["first_used_bank_revision"])', f'self.assertEqual("{release_id}", registry["first_used_bank_revision"])')
          t = t.replace('if self.candidates[candidate_id]["state"] == "VERIFIED":\n                self.assertIn(question_id, verified_ids)\n            else:\n                self.assertNotIn(question_id, verified_ids)', 'self.assertEqual("RELEASED", self.candidates[candidate_id]["state"])\n            self.assertIn(question_id, verified_ids)')
          t = t.replace('self.assertEqual(100, len(released))', 'self.assertEqual(188, len(released))').replace('self.assertEqual(100, runtime_count)', 'self.assertEqual(188, runtime_count)')
          p.write_text(t, encoding="utf-8")

          for name in ("test_b2_acceptance_packets.py", "test_b3_acceptance_packets.py"):
              p = tool_dir / "tests" / name
              t = p.read_text(encoding="utf-8")
              t = t.replace('{candidate_id: "VERIFIED" for candidate_id in self.accepted_ids}', '{candidate_id: "RELEASED" for candidate_id in self.accepted_ids}')
              t = t.replace('self.assertEqual("draft", questions[question_id]["status"])', 'self.assertEqual("active", questions[question_id]["status"])')
              t = t.replace('self.assertEqual("", registry[question_id]["first_used_bank_revision"])', f'self.assertEqual("{release_id}", registry[question_id]["first_used_bank_revision"])')
              p.write_text(t, encoding="utf-8")

          p = tool_dir / "tests/test_question_bank.py"
          t = p.read_text(encoding="utf-8")
          marker = "class DroneQuestionBankTest(unittest.TestCase):"
          prefix, suffix = t.split(marker, 1)
          suffix = suffix.replace(
              '    PRODUCTION_REVISION = "drone-second-class-v1-release-2026-08-20"',
              '    PRODUCTION_REVISION = "drone-second-class-v1-release-2026-08-20"\n    CURRENT_PRODUCTION_REVISION = "drone-second-class-v2-release-2026-08-24"'
          )
          suffix = suffix.replace('self.assertEqual(len(inputs.released_questions), 100)', 'self.assertEqual(len(inputs.released_questions), 188)')
          suffix = suffix.replace('self.assertEqual(len(cards), 100)', 'self.assertEqual(len(cards), 188)').replace('self.assertEqual(len({card["stableId"] for card in cards}), 100)', 'self.assertEqual(len({card["stableId"] for card in cards}), 188)')
          suffix = suffix.replace('self.assertEqual(manifest["question_count"], 100)', 'self.assertEqual(manifest["question_count"], 188)')
          suffix = suffix.replace('self.assertEqual(len(runtime_cards), 100)', 'self.assertEqual(len(runtime_cards), 188)').replace('self.assertEqual(len({card["stableId"] for card in runtime_cards}), 100)', 'self.assertEqual(len({card["stableId"] for card in runtime_cards}), 188)')
          suffix = suffix.replace('for sequence in range(1, 101)', 'for sequence in range(1, 189)')
          suffix = suffix.replace('self.assertEqual(len(production_questions), 100)', 'self.assertEqual(len(production_questions), 188)')
          suffix = suffix.replace('self.assertEqual(inputs.metadata["content_as_of"], "2026-08-19")', 'self.assertEqual(inputs.metadata["content_as_of"], "2026-08-24")')
          suffix = suffix.replace('self.assertEqual(manifest["content_as_of"], "2026-08-19")', 'self.assertEqual(manifest["content_as_of"], "2026-08-24")')
          suffix = suffix.replace('inputs.metadata["bank_revision"],\n            self.PRODUCTION_REVISION', 'inputs.metadata["bank_revision"],\n            self.CURRENT_PRODUCTION_REVISION')
          suffix = suffix.replace('manifest["bank_revision"],\n            self.PRODUCTION_REVISION', 'manifest["bank_revision"],\n            self.CURRENT_PRODUCTION_REVISION')
          old_all_first_use = '''all(\n                registry_by_id[question_id]["first_used_bank_revision"] == self.PRODUCTION_REVISION\n                for question_id in question_ids\n            )'''
          new_all_first_use = '''all(\n                registry_by_id[question_id]["first_used_bank_revision"]\n                == (self.PRODUCTION_REVISION if int(question_id.rsplit("-", 1)[1]) <= 100 else self.CURRENT_PRODUCTION_REVISION)\n                for question_id in question_ids\n            )'''
          suffix = suffix.replace(old_all_first_use, new_all_first_use)
          p.write_text(prefix + marker + suffix, encoding="utf-8")

          focused = tool_dir / "tests/test_drone_release_activation_188.py"
          focused.write_text('''from __future__ import annotations\nimport csv,json,sys,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[3]\nBANK=ROOT/"question_banks/drone_second_class"\nA=BANK/"authoring"\nsys.path.insert(0,str(ROOT/"tooling/question_bank"))\nfrom expansion import validate_expansion_batch\nfrom validation import validate_bank\nREV="drone-second-class-v2-release-2026-08-24"\nOLD="drone-second-class-v1-release-2026-08-20"\nclass Release188Test(unittest.TestCase):\n def test_release_is_exact_and_generated(self):\n  meta=json.loads((A/"bank.json").read_text(encoding="utf-8")); self.assertEqual(REV,meta["bank_revision"]); self.assertEqual("2026-08-24",meta["content_as_of"])\n  with (A/"questions.csv").open(encoding="utf-8",newline="") as h: q={r["question_id"]:r for r in csv.DictReader(h)}\n  ids=[f"DRONE-Q-{n:06d}" for n in range(1,189)]; self.assertEqual(set(ids),set(q)); self.assertTrue(all(q[i]["status"]=="active" for i in ids)); self.assertTrue(all(q[i]["last_reviewed_at"]=="2026-08-24" for i in ids[100:]))\n  with (A/"question_id_registry.csv").open(encoding="utf-8",newline="") as h: reg={r["question_id"]:r for r in csv.DictReader(h)}\n  self.assertTrue(all(reg[i]["first_used_bank_revision"]==OLD for i in ids[:100])); self.assertTrue(all(reg[i]["first_used_bank_revision"]==REV for i in ids[100:]))\n  released=json.loads((A/"released_questions.json").read_text(encoding="utf-8"))["released_questions"]; self.assertEqual(ids,[r["question_id"] for r in released])\n  runtime_path=BANK/"generated/drone_second_class_bank.json"; app=ROOT/"apps/drone_second_class/assets/question_bank/drone_second_class_bank.json"; self.assertEqual(runtime_path.read_bytes(),app.read_bytes())\n  runtime=json.loads(runtime_path.read_text(encoding="utf-8")); cards=[c for d in runtime["decks"] for u in d["units"] for c in u["cards"]]; self.assertEqual(set(ids),{c["stableId"] for c in cards}); self.assertEqual(20,sum(not c["isPremium"] for c in cards))\n  manifest=json.loads((BANK/"generated/bank_manifest.json").read_text(encoding="utf-8")); self.assertEqual(188,manifest["question_count"]); self.assertEqual(20,manifest["free_question_count"]); self.assertEqual(REV,manifest["bank_revision"])\n  result=validate_bank(BANK,check_generated=True); self.assertTrue(result.is_valid,[str(i) for i in result.issues])\n  for n in range(1,5): self.assertEqual([],validate_expansion_batch(A/"batches"/f"batch_{n:03d}"))\n def test_exact_88_candidates_released(self):\n  mapped=[]\n  for n in range(1,5):\n   with (A/"batches"/f"batch_{n:03d}"/"candidates.csv").open(encoding="utf-8",newline="") as h: rows=list(csv.DictReader(h))\n   mapped += [r for r in rows if r["permanent_question_id"]]\n  selected=[r for r in mapped if 101<=int(r["permanent_question_id"].rsplit("-",1)[1])<=188]\n  self.assertEqual(88,len(selected)); self.assertTrue(all(r["state"]=="RELEASED" for r in selected))\n  self.assertTrue(all(r["state"]!="RELEASED" for r in mapped if r not in selected))\nif __name__=="__main__": unittest.main()\n''', encoding="utf-8")

          observed_main = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          state["observed_main"] = observed_main
          state["current_phase"] = "FEATURE_COMPLETION"
          state["next_atomic_objective"] = "VERIFY_FEATURE_COMPLETION_EXIT_CRITERIA"
          state["state_epoch"] = 26
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Final exact evidence gate before any commit is allowed.
          final = validate_bank(bank_root, check_generated=True)
          if not final.is_valid:
              raise SystemExit("final bank validation failed: " + " | ".join(str(i) for i in final.errors))
          for batch in batch_dirs:
              errors = validate_expansion_batch(batch)
              if errors:
                  raise SystemExit(f"final batch validation failed {batch.name}: {' | '.join(errors)}")
          runtime = json.loads(generated_path.read_text(encoding="utf-8"))
          runtime_ids = [card["stableId"] for deck in runtime["decks"] for unit in deck["units"] for card in unit["cards"]]
          manifest = json.loads((bank_root / "generated/bank_manifest.json").read_text(encoding="utf-8"))
          if set(runtime_ids) != set(all_ids) or len(runtime_ids) != 188 or manifest.get("question_count") != 188 or manifest.get("free_question_count") != 20:
              raise SystemExit("final generated count/ID invariant failed")
          if generated_path.read_bytes() != app_asset.read_bytes():
              raise SystemExit("final generated/app asset mismatch")
          PY

      - name: Run focused and full repository Question Bank gates
        shell: bash
        run: |
          python3 tooling/question_bank/validate.py --bank question_banks/drone_second_class --check-generated
          python3 tooling/question_bank/generate.py --bank question_banks/drone_second_class --check
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/drone_state.json
          python3 tooling/question_bank/tests/test_drone_release_activation_188.py
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'

      - name: Commit durable activation transition
        shell: bash
        run: |
          rm -f .github/drone-release-activation-188-trigger
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^question_banks/drone_second_class/validation/formal_snapshot/'; then
            echo 'Historical V0 formal snapshot mutation is prohibited' >&2
            exit 1
          fi
          git commit -m 'Activate Drone Production Bank 188'
          git push --force-with-lease origin HEAD:chatgpt/drone-release-activate-188
