name: Drone Free30 Monetization UX Worker

on:
  push:
    branches:
      - chatgpt/drone-free30-monetization-ux
    paths:
      - '.github/drone-free30-monetization-ux-trigger'

permissions:
  contents: write

jobs:
  mutate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-free30-monetization-ux
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "100670593+Komadeki@users.noreply.github.com"

      - name: Apply implementation
        run: python3 .github/drone-free30-monetization-ux-worker.py

      - name: Regenerate Drone bank
        run: |
          python3 tooling/question_bank/generate.py --bank question_banks/drone_second_class
          cp question_banks/drone_second_class/generated/drone_second_class_bank.json apps/drone_second_class/assets/question_bank/drone_second_class_bank.json
          python3 tooling/question_bank/generate.py --bank question_banks/drone_second_class --check

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Test shared qualification app
        working-directory: packages/qualification_app
        run: |
          flutter pub get
          flutter test test/production_widget_test.dart

      - name: Test Drone app
        working-directory: apps/drone_second_class
        run: |
          flutter pub get
          flutter test test/production_widget_test.dart

      - name: Verify free-tier contract
        run: |
          git diff --check
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          with Path('question_banks/drone_second_class/authoring/questions.csv').open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          active = [row for row in rows if row['status'] == 'active']
          free = [row for row in active if row['is_free'] == 'true']
          assert len(active) == 188, len(active)
          assert len(free) == 30, len(free)
          manifest = json.loads(Path('question_banks/drone_second_class/generated/bank_manifest.json').read_text())
          assert manifest['question_count'] == 188
          assert manifest['free_question_count'] == 30
          assert manifest['bank_revision'] == 'drone-second-class-v3-release-2026-08-25'
          print('verified:', manifest['bank_revision'], manifest['question_count'], manifest['free_question_count'])
          PY

      - name: Remove temporary worker files
        run: |
          rm -f .github/drone-free30-monetization-ux-worker.py
          rm -f .github/drone-free30-monetization-ux-trigger
          rm -f .github/workflows/drone-free30-monetization-ux-worker.yml

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Improve Drone monetization UX and expand free tier"
          git push origin HEAD:chatgpt/drone-free30-monetization-ux
