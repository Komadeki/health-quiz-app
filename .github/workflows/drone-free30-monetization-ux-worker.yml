name: Drone Free30 Monetization UX Worker

on:
  push:
    branches:
      - chatgpt/drone-free30-monetization-ux
    paths:
      - '.github/drone-free30-monetization-ux-trigger'

permissions:
  contents: write

jobs:
  mutate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-free30-monetization-ux
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "100670593+Komadeki@users.noreply.github.com"

      - name: Apply free-tier and monetization UX changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import json
          import math
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          repo = Path('.')
          questions_path = repo / 'question_banks/drone_second_class/authoring/questions.csv'
          bank_path = repo / 'question_banks/drone_second_class/authoring/bank.json'
          readme_path = repo / 'question_banks/drone_second_class/README.md'
          production_path = repo / 'packages/qualification_app/lib/src/production_app.dart'
          progress_path = repo / 'packages/qualification_app/lib/src/progress_dashboard.dart'
          shared_test_path = repo / 'packages/qualification_app/test/production_widget_test.dart'
          drone_test_path = repo / 'apps/drone_second_class/test/production_widget_test.dart'

          # 1) Expand the free tier from 20 to 30 while preserving all existing
          # free questions. Allocate the 10 additions proportionally by unit so
          # the free sample stays representative of the 188-question bank.
          with questions_path.open('r', encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)
          assert fieldnames is not None
          active = [r for r in rows if r['status'] == 'active']
          current_free = [r for r in active if r['is_free'] == 'true']
          assert len(current_free) == 20, f'expected 20 current free questions, got {len(current_free)}'
          unit_totals = Counter(r['unit_id'] for r in active)
          unit_free = Counter(r['unit_id'] for r in current_free)
          target_total = 30
          raw_targets = {
              unit: target_total * count / len(active)
              for unit, count in unit_totals.items()
          }
          targets = {
              unit: max(unit_free[unit], math.floor(raw_targets[unit]))
              for unit in unit_totals
          }
          while sum(targets.values()) < target_total:
              unit = max(
                  unit_totals,
                  key=lambda u: (
                      raw_targets[u] - math.floor(raw_targets[u]),
                      unit_totals[u],
                      u,
                  ) if targets[u] < unit_totals[u] else (-1, -1, ''),
              )
              targets[unit] += 1
          while sum(targets.values()) > target_total:
              candidates = [
                  u for u in unit_totals
                  if targets[u] > unit_free[u]
              ]
              assert candidates
              unit = min(candidates, key=lambda u: (raw_targets[u] - targets[u], u))
              targets[unit] -= 1

          premium_by_unit = defaultdict(list)
          for row in active:
              if row['is_free'] != 'true':
                  premium_by_unit[row['unit_id']].append(row)
          for items in premium_by_unit.values():
              items.sort(key=lambda r: r['question_id'])

          selected_ids = []
          for unit in sorted(unit_totals):
              need = targets[unit] - unit_free[unit]
              assert need >= 0
              for row in premium_by_unit[unit][:need]:
                  row['is_free'] = 'true'
                  row['question_version'] = str(int(row['question_version']) + 1)
                  selected_ids.append(row['question_id'])

          final_free = [r for r in active if r['is_free'] == 'true']
          assert len(final_free) == 30, len(final_free)
          final_by_unit = Counter(r['unit_id'] for r in final_free)
          assert final_by_unit == Counter(targets), (final_by_unit, targets)

          buf = io.StringIO(newline='')
          writer = csv.DictWriter(buf, fieldnames=fieldnames, lineterminator='\n')
          writer.writeheader()
          writer.writerows(rows)
          questions_path.write_text(buf.getvalue(), encoding='utf-8')

          bank = json.loads(bank_path.read_text(encoding='utf-8'))
          old_revision = bank['bank_revision']
          assert old_revision == 'drone-second-class-v2-release-2026-08-24', old_revision
          bank['bank_revision'] = 'drone-second-class-v3-release-2026-08-25'
          bank_path.write_text(json.dumps(bank, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              'Production release v2 activates the complete 188-question canonical bank without changing\nquestion content or permanent identities.':
                  'Production release v3 keeps the complete 188-question canonical bank and expands the\nfree tier from 20 to 30 questions without changing question content or permanent identities.',
              '- Production bank revision: `drone-second-class-v2-release-2026-08-24`.':
                  '- Production bank revision: `drone-second-class-v3-release-2026-08-25`.',
              '- Production runtime: 188 active questions, 20 free, and 168 premium.':
                  '- Production runtime: 188 active questions, 30 free, and 158 premium.',
              '- Free selection remains the original 20 permanent IDs; the 88 expansion questions remain premium.':
                  '- Free selection preserves the original 20 and adds 10 already-released questions while keeping the sample distributed across all four units.',
          }
          for old, new in replacements.items():
              assert old in readme, f'missing README anchor: {old}'
              readme = readme.replace(old, new, 1)
          marker = '- Free selection preserves the original 20 and adds 10 already-released questions while keeping the sample distributed across all four units.'
          selected_line = '- Added free IDs for v3: ' + ', '.join(selected_ids) + '.'
          readme = readme.replace(marker, marker + '\n' + selected_line, 1)
          readme_path.write_text(readme, encoding='utf-8')

          # 2) Strengthen the shared paywall without altering StoreKit pricing.
          production = production_path.read_text(encoding='utf-8')

          progress_metric_pattern = re.compile(
              r"final class _ProgressMetric extends StatelessWidget \{.*?\n\}\n\nFuture<void> _showLearningStatus",
              re.S,
          )
          progress_metric_replacement = r'''final class _ProgressMetric extends StatelessWidget {
            const _ProgressMetric({
              required this.icon,
              required this.value,
              required this.label,
              this.onTap,
              super.key,
            });

            final IconData icon;
            final String value;
            final String label;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) {
              final colors = Theme.of(context).colorScheme;
              final content = Container(
                constraints: const BoxConstraints(minHeight: 96),
                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 10),
                decoration: BoxDecoration(
                  color: colors.secondaryContainer.withValues(alpha: 0.65),
                  borderRadius: BorderRadius.circular(16),
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Icon(icon, size: 18, color: colors.onSecondaryContainer),
                    const SizedBox(height: 6),
                    Text(
                      value,
                      style: Theme.of(
                        context,
                      ).textTheme.titleMedium?.copyWith(fontWeight: FontWeight.w800),
                    ),
                    Text(label, style: Theme.of(context).textTheme.labelMedium),
                  ],
                ),
              );
              if (onTap == null) return content;
              return Semantics(
                button: true,
                label: '$label $value。模擬試験を開く',
                child: InkWell(
                  borderRadius: BorderRadius.circular(16),
                  onTap: onTap,
                  child: content,
                ),
              );
            }
          }

          Future<void> _showLearningStatus'''
          production, count = progress_metric_pattern.subn(progress_metric_replacement, production, count=1)
          assert count == 1, f'progress metric replacement count={count}'

          mock_sheet_pattern = re.compile(
              r"Future<void> _showMockExamUnlockSheet\(.*?\n\}\n\nfinal class _RecommendationCard",
              re.S,
          )
          mock_sheet_replacement = r'''Future<void> _showMockExamUnlockSheet(
            BuildContext context,
            QualificationProductionController controller,
          ) {
            final price = controller.fullUnlockProduct?.price;
            final total = controller.bank!.cards.length;
            final mockLabel = _mockExamUnlockLabel(controller);
            return showModalBottomSheet<void>(
              context: context,
              showDragHandle: true,
              builder: (sheetContext) => SafeArea(
                child: Padding(
                  key: const Key('mock-exam-unlock-sheet'),
                  padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Text(
                        '模擬試験を解放',
                        style: Theme.of(context).textTheme.titleLarge,
                      ),
                      const SizedBox(height: 8),
                      const Text('本番を想定した模擬試験は全問解放後に利用できます。'),
                      const SizedBox(height: 14),
                      _UnlockBenefitRow(label: '全$total問すべて利用可能'),
                      const SizedBox(height: 6),
                      const _UnlockBenefitRow(label: '各単元の全問題'),
                      const SizedBox(height: 6),
                      _UnlockBenefitRow(label: mockLabel),
                      const SizedBox(height: 14),
                      Text(price == null ? '価格を確認できません' : '買い切り $price'),
                      const SizedBox(height: 16),
                      FilledButton(
                        key: const Key('mock-exam-unlock-purchase'),
                        onPressed: controller.purchasePending || price == null
                            ? null
                            : () {
                                Navigator.of(sheetContext).pop();
                                unawaited(controller.purchaseFullUnlock());
                              },
                        child: Text('全$total問を解放する'),
                      ),
                      TextButton(
                        onPressed: () => Navigator.of(sheetContext).pop(),
                        child: const Text('あとで'),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }

          String _mockExamUnlockLabel(QualificationProductionController controller) {
            final profile = controller.definition.examProfile;
            if (profile == null) return '模擬試験';
            final minutes = profile.timeLimitMinutes;
            if (minutes == null) return '模擬試験（${profile.questionCount}問）';
            return '模擬試験（${profile.questionCount}問・$minutes分）';
          }

          final class _UnlockBenefitRow extends StatelessWidget {
            const _UnlockBenefitRow({required this.label});

            final String label;

            @override
            Widget build(BuildContext context) => Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Icon(
                      Icons.check_circle_outline,
                      size: 18,
                      color: Theme.of(context).colorScheme.primary,
                    ),
                    const SizedBox(width: 8),
                    Expanded(child: Text(label)),
                  ],
                );
          }

          final class _RecommendationCard'''
          production, count = mock_sheet_pattern.subn(mock_sheet_replacement, production, count=1)
          assert count == 1, f'mock sheet replacement count={count}'

          unlock_pattern = re.compile(
              r"final class _UnlockCard extends StatelessWidget \{.*?\n\}\n\nfinal class _InformationLinks",
              re.S,
          )
          unlock_replacement = r'''final class _UnlockCard extends StatelessWidget {
            const _UnlockCard({required this.controller});

            final QualificationProductionController controller;

            @override
            Widget build(BuildContext context) {
              final total = controller.bank!.cards.length;
              if (controller.hasFullUnlock) {
                return Card(
                  child: ListTile(
                    leading: const Icon(Icons.lock_open),
                    title: Text('全$total問 解放済み'),
                  ),
                );
              }
              final price = controller.fullUnlockProduct?.price;
              final completedFree = math.min(
                controller.progress?.overall.completedQuestions ?? 0,
                controller.freeQuestionCount,
              );
              return Card(
                key: const Key('full-unlock-card'),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Text('全問解放', style: Theme.of(context).textTheme.titleMedium),
                      const SizedBox(height: 4),
                      Text(
                        '無料問題 $completedFree / ${controller.freeQuestionCount}問 学習済み',
                        key: const Key('free-tier-progress'),
                      ),
                      const SizedBox(height: 14),
                      _UnlockBenefitRow(label: '全$total問すべて利用可能'),
                      const SizedBox(height: 6),
                      const _UnlockBenefitRow(label: '各単元の全問題'),
                      const SizedBox(height: 6),
                      _UnlockBenefitRow(label: _mockExamUnlockLabel(controller)),
                      const SizedBox(height: 12),
                      Text(price == null ? '価格を確認できません' : '買い切り $price'),
                      const SizedBox(height: 12),
                      FilledButton(
                        key: const Key('purchase-full-unlock'),
                        onPressed: controller.purchasePending || price == null
                            ? null
                            : controller.purchaseFullUnlock,
                        child: Text(
                          controller.purchasePending
                              ? '確認中…'
                              : '全$total問を解放する',
                        ),
                      ),
                      TextButton(
                        key: const Key('restore-purchases'),
                        onPressed: controller.purchasePending
                            ? null
                            : controller.restorePurchases,
                        child: const Text('購入を復元'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          final class _InformationLinks'''
          production, count = unlock_pattern.subn(unlock_replacement, production, count=1)
          assert count == 1, f'unlock card replacement count={count}'
          production_path.write_text(production, encoding='utf-8')

          # 3) Make the "未受験" mock metric actionable and compact the legend.
          progress = progress_path.read_text(encoding='utf-8')
          old_metrics_call = '''          _ProgressMetrics(
            completed: '${overall.completedQuestions}問',
            accuracy: accuracy,
            review: '$reviewCount問',
            mockBest: mockBest,
          ),'''
          new_metrics_call = '''          _ProgressMetrics(
            completed: '${overall.completedQuestions}問',
            accuracy: accuracy,
            review: '$reviewCount問',
            mockBest: mockBest,
            onMockBestTap: bestMock == null &&
                    controller.modeEnabled(LearningModeV1.mockExam)
                ? () {
                    if (controller.isMockExamLocked) {
                      unawaited(_showMockExamUnlockSheet(context, controller));
                    } else {
                      unawaited(controller.startMockExam());
                    }
                  }
                : null,
          ),'''
          assert old_metrics_call in progress
          progress = progress.replace(old_metrics_call, new_metrics_call, 1)
          progress = progress.replace(
              '''    required this.mockBest,\n  });\n\n  final String completed;\n  final String accuracy;\n  final String review;\n  final String mockBest;''',
              '''    required this.mockBest,\n    this.onMockBestTap,\n  });\n\n  final String completed;\n  final String accuracy;\n  final String review;\n  final String mockBest;\n  final VoidCallback? onMockBestTap;''',
              1,
          )
          old_mock_metric = '''      _MetricDescriptor(
        keyName: 'progress-metric-mock-best',
        icon: Icons.fact_check_outlined,
        label: '模試ベスト',
      ).build(mockBest),'''
          new_mock_metric = '''      _MetricDescriptor(
        keyName: 'progress-metric-mock-best',
        icon: Icons.fact_check_outlined,
        label: '模試ベスト',
      ).build(mockBest, onTap: onMockBestTap),'''
          assert old_mock_metric in progress
          progress = progress.replace(old_mock_metric, new_mock_metric, 1)
          old_build = '''  Widget build(String value) => KeyedSubtree(
    key: Key(keyName),
    child: _ProgressMetric(icon: icon, value: value, label: label),
  );'''
          new_build = '''  Widget build(String value, {VoidCallback? onTap}) => _ProgressMetric(
    key: Key(keyName),
    icon: icon,
    value: value,
    label: label,
    onTap: onTap,
  );'''
          assert old_build in progress
          progress = progress.replace(old_build, new_build, 1)
          old_columns = 'final columns = constraints.maxWidth < 430 || textScale > 1.35 ? 1 : 2;'
          new_columns = 'final columns = constraints.maxWidth < 300 || textScale > 1.35 ? 1 : 2;'
          assert old_columns in progress
          progress = progress.replace(old_columns, new_columns, 1)
          progress_path.write_text(progress, encoding='utf-8')

          # 4) Extend tests to cover the conversion path and the 30/20 contract.
          shared_test = shared_test_path.read_text(encoding='utf-8')
          anchor = '''    expect(
      find.descendant(of: mockBest, matching: find.text('未受験')),
      findsOneWidget,
    );

    final lockedMock = find.byKey(const Key('start-mock-exam'));'''
          replacement = '''    expect(
      find.descendant(of: mockBest, matching: find.text('未受験')),
      findsOneWidget,
    );
    await tester.tap(mockBest);
    await tester.pumpAndSettle();
    expect(find.byKey(const Key('mock-exam-unlock-sheet')), findsOneWidget);
    await tester.binding.handlePopRoute();
    await tester.pumpAndSettle();

    final lockedMock = find.byKey(const Key('start-mock-exam'));'''
          assert anchor in shared_test
          shared_test = shared_test.replace(anchor, replacement, 1)
          anchor2 = '''    expect(
      find.descendant(of: unlockSheet, matching: find.text('買い切り Fixture')),
      findsOneWidget,
    );
    await tester.binding.handlePopRoute();'''
          replacement2 = '''    expect(
      find.descendant(of: unlockSheet, matching: find.text('買い切り Fixture')),
      findsOneWidget,
    );
    expect(
      find.descendant(
        of: unlockSheet,
        matching: find.text('全${controller.bank!.cards.length}問を解放する'),
      ),
      findsOneWidget,
    );
    await tester.binding.handlePopRoute();'''
          assert anchor2 in shared_test
          shared_test = shared_test.replace(anchor2, replacement2, 1)
          insert_after = '''    await tester.binding.handlePopRoute();
    await tester.pumpAndSettle();

    for (final unsupported in ['合格可能性', 'AI合否', '本番力']) {'''
          insert_replacement = '''    await tester.binding.handlePopRoute();
    await tester.pumpAndSettle();

    final purchase = find.byKey(const Key('purchase-full-unlock'));
    await tester.scrollUntilVisible(purchase, 160);
    expect(find.byKey(const Key('free-tier-progress')), findsOneWidget);
    expect(find.text('各単元の全問題'), findsOneWidget);
    expect(
      find.text('全${controller.bank!.cards.length}問を解放する'),
      findsOneWidget,
    );

    for (final unsupported in ['合格可能性', 'AI合否', '本番力']) {'''
          assert insert_after in shared_test
          shared_test = shared_test.replace(insert_after, insert_replacement, 1)
          shared_test_path.write_text(shared_test, encoding='utf-8')

          drone_test = drone_test_path.read_text(encoding='utf-8')
          final_anchor = '\n}\n'
          assert drone_test.endswith(final_anchor)
          added_test = r'''

            test('Drone free tier exposes 30 questions and random practice can use 20', () async {
              final controller = createProductionController();
              await controller.initialize();
              addTearDown(controller.dispose);

              expect(controller.freeQuestionCount, 30);
              expect(controller.accessibleQuestionCount, 30);
              final started = await controller.startRandom();
              expect(started, isTrue);
              expect(controller.activeSession?.questionIds.length, 20);
            });
          '''
          drone_test = drone_test[:-2] + added_test + '\n}\n'
          drone_test_path.write_text(drone_test, encoding='utf-8')

          print('Selected free IDs:', ', '.join(selected_ids))
          print('Free targets:', dict(sorted(targets.items())))
          PY

      - name: Regenerate Drone runtime bank
        run: |
          set -euo pipefail
          python3 tooling/question_bank/generate.py \
            --bank question_banks/drone_second_class
          cp question_banks/drone_second_class/generated/drone_second_class_bank.json \
            apps/drone_second_class/assets/question_bank/drone_second_class_bank.json
          python3 tooling/question_bank/generate.py \
            --bank question_banks/drone_second_class \
            --check

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Test shared qualification app
        working-directory: packages/qualification_app
        run: |
          flutter pub get
          flutter test test/production_widget_test.dart

      - name: Test Drone app
        working-directory: apps/drone_second_class
        run: |
          flutter pub get
          flutter test test/production_widget_test.dart

      - name: Verify diff and free-tier counts
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          q = Path('question_banks/drone_second_class/authoring/questions.csv')
          with q.open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          active = [r for r in rows if r['status'] == 'active']
          free = [r for r in active if r['is_free'] == 'true']
          assert len(active) == 188
          assert len(free) == 30
          print('Free by unit:', dict(sorted(Counter(r['unit_id'] for r in free).items())))
          manifest = json.loads(Path('question_banks/drone_second_class/generated/bank_manifest.json').read_text())
          assert manifest['question_count'] == 188
          assert manifest['free_question_count'] == 30
          assert manifest['bank_revision'] == 'drone-second-class-v3-release-2026-08-25'
          print('Manifest:', manifest['bank_revision'], manifest['question_count'], manifest['free_question_count'])
          PY

      - name: Remove temporary worker files
        run: |
          rm -f .github/workflows/drone-free30-monetization-ux-worker.yml
          rm -f .github/drone-free30-monetization-ux-trigger

      - name: Commit and push implementation
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Improve Drone monetization UX and expand free tier"
          git push origin HEAD:chatgpt/drone-free30-monetization-ux
