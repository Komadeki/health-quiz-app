name: Cancel Stalled Drone Asset Run

on:
  push:
    branches:
      - chatgpt/drone-testflight-preview-current
    paths:
      - '.github/cancel-drone-asset-run-trigger'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel stalled macOS asset preparation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '32970833936'
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
