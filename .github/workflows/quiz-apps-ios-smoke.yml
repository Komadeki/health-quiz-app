name: Quiz Apps iOS Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  push:
    tags:
      - 'quiz-apps-v*'

permissions:
  contents: read

jobs:
  discover-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.apps.outputs.apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover direct-child apps
        id: apps
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import json
          import os

          apps = sorted(
              os.path.basename(os.path.dirname(path))
              for path in glob.glob("apps/*/app.yaml")
          )
          print("apps=" + json.dumps(apps, separators=(",", ":")))
          PY

  ios-smoke:
    needs: discover-apps
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover-apps.outputs.apps) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Build iOS without signing
        working-directory: apps/${{ matrix.app }}
        run: flutter build ios --no-codesign
