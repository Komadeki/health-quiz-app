name: Quiz Engine CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Get quiz_engine dependencies
        working-directory: packages/quiz_engine
        run: dart pub get

      - name: Get app manifest tooling dependencies
        working-directory: tooling/app_manifest
        run: dart pub get

      - name: Get reference app dependencies
        working-directory: reference_apps/_single_unlock_fixture
        run: flutter pub get

      - name: Analyze quiz_engine strictly
        working-directory: packages/quiz_engine
        run: dart analyze --fatal-infos

      - name: Test quiz_engine
        working-directory: packages/quiz_engine
        run: dart test

      - name: Analyze app manifest tooling strictly
        working-directory: tooling/app_manifest
        run: dart analyze --fatal-infos

      - name: Test app manifest tooling
        working-directory: tooling/app_manifest
        run: dart test

      - name: Validate all app manifests and generated drift
        working-directory: tooling/app_manifest
        run: >-
          dart run bin/validate.dart
          --repository-root ../..
          --check-generated

      - name: Check app manifest generation drift
        working-directory: tooling/app_manifest
        run: dart run bin/generate.dart --repository-root ../.. --check

      - name: Test question-bank tooling
        run: >-
          python3 -m unittest discover
          -s tooling/question_bank/tests
          -p 'test_*.py'

      - name: Validate qualification fixture and generated drift
        run: >-
          python3 tooling/question_bank/validate.py
          --bank question_banks/qualification_fixture
          --check-generated

      - name: Analyze project errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze reference app strictly
        working-directory: reference_apps/_single_unlock_fixture
        run: flutter analyze

      - name: Test reference app
        working-directory: reference_apps/_single_unlock_fixture
        run: flutter test

      - name: Analyze changed Dart files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r file; do
            case "$file" in
              packages/quiz_engine/*|tooling/app_manifest/*|reference_apps/_single_unlock_fixture/*)
                continue
                ;;
            esac
            dart analyze --fatal-infos "$file"
          done < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.dart'
          )

      - name: Test
        if: always()
        run: flutter test
