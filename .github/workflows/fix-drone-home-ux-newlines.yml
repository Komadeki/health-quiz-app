name: Fix Drone Home UX Newlines

on:
  push:
    branches:
      - chatgpt/drone-home-ux-followup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-home-ux-followup
          fetch-depth: 0
      - run: python3 .github/scripts/fix_drone_home_ux_newlines.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/fix_drone_home_ux_newlines.py
          rm .github/workflows/fix-drone-home-ux-newlines.yml
          git config user.name "SABRmetricsDev"
          git config user.email "100670593+Komadeki@users.noreply.github.com"
          git add packages/qualification_app/lib/src/production_app.dart \
                  .github/scripts/fix_drone_home_ux_newlines.py \
                  .github/workflows/fix-drone-home-ux-newlines.yml
          git commit -m "Fix weakness copy newlines"
          git push origin HEAD:chatgpt/drone-home-ux-followup
