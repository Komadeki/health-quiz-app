name: Otsu4 Wave Source Verification PR Worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'question_banks/otsu4/authoring/waves/source_verification_request.json'

permissions:
  contents: write

concurrency:
  group: otsu4-wave-source-verification-pr-worker
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'chatgpt/otsu4-wave-source-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Wave source verification branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/otsu4-wave-source-verify
          fetch-depth: 0
      - name: Reconcile to current main
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Verify Otsu4 Wave canonical sources
        run: python3 tooling/komadeki_autopilot/otsu4_wave_source_verification_transition.py
      - name: Validate source verification and repository gates
        run: |
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/otsu4_state.json
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'
          python3 tooling/question_bank/validate.py --bank question_banks/otsu4 --check-generated
      - name: Commit durable Otsu4 Wave source verification
        run: |
          rm -f question_banks/otsu4/authoring/waves/source_verification_request.json
          git add -A
          git diff --cached --check
          git commit -m 'Verify Otsu4 Wave canonical sources'
          git push --force-with-lease origin HEAD:chatgpt/otsu4-wave-source-verify
