name: Drone Production Bank 188 Release Activation Repair Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/drone-release-activation-188-trigger'

permissions:
  contents: write

concurrency:
  group: drone-release-activation-188-repair-worker
  cancel-in-progress: false

jobs:
  activate-repair:
    if: github.head_ref == 'chatgpt/drone-release-activate-188'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-release-activate-188
          fetch-depth: 0

      - name: Reconcile to authoritative current main
        shell: bash
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Execute persisted activation program and repair lifecycle assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          repo = Path.cwd()
          original = repo / ".github/workflows/drone-release-activation-188-worker.yml"
          text = original.read_text(encoding="utf-8")
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY"
          start = text.index(begin) + len(begin)
          stop = text.index(end, start)
          script_lines = []
          for line in text[start:stop].splitlines():
              script_lines.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(script_lines) + "\n"
          exec(compile(script, str(original) + ":activation", "exec"), {"__name__": "__main__"})

          tests = repo / "tooling/question_bank/tests"

          # Production lifecycle is RELEASED after the atomic activation.
          p = tests / "test_expansion.py"
          t = p.read_text(encoding="utf-8")
          old = 'self.assertEqual({"VERIFIED"}, {row["state"] for row in rows})'
          if old not in t:
              raise SystemExit("expected migrated Drone expansion assertion not found")
          t = t.replace(old, 'self.assertEqual({"RELEASED"}, {row["state"] for row in rows})', 1)
          p.write_text(t, encoding="utf-8")

          p = tests / "test_question_bank.py"
          t = p.read_text(encoding="utf-8")

          # The permanent-slot map is the protected original 100, while Production now has Q1..Q188.
          old_namespace = '''        self.assertEqual(\n            set(question_ids),\n            set(self.PERMANENT_SLOT_TO_ID.values()),\n        )'''
          new_namespace = '''        self.assertEqual(\n            set(question_ids),\n            {f"DRONE-Q-{sequence:06d}" for sequence in range(1, 189)},\n        )'''
          if old_namespace not in t:
              raise SystemExit("expected namespace production-ID assertion not found")
          t = t.replace(old_namespace, new_namespace, 1)

          start = t.index("    def test_drone_production_release_contract(self) -> None:")
          stop = t.index("    def test_production_release_preserves_all_protected_question_content", start)
          method = t[start:stop]

          legacy_verified = '''        self.assertTrue(\n            all(\n                "verification_state=author_source_verified"\n                in question["notes_internal"]\n                for question in production_questions\n            )\n        )'''
          legacy_verified_new = '''        self.assertTrue(\n            all(\n                "verification_state=author_source_verified"\n                in question["notes_internal"]\n                for question in production_questions[:100]\n            )\n        )'''
          legacy_release = '''        self.assertTrue(\n            all(\n                "release_approved=true" in question["notes_internal"]\n                for question in production_questions\n            )\n        )'''
          legacy_release_new = '''        self.assertTrue(\n            all(\n                "release_approved=true" in question["notes_internal"]\n                for question in production_questions[:100]\n            )\n        )'''
          if legacy_verified not in method or legacy_release not in method:
              raise SystemExit("expected legacy note assertions not found")
          method = method.replace(legacy_verified, legacy_verified_new, 1).replace(legacy_release, legacy_release_new, 1)

          old_first_use = '''        self.assertTrue(\n            all(\n                next(entry for entry in inputs.id_registry if entry["question_id"] == question_id)["first_used_bank_revision"]\n                == self.PRODUCTION_REVISION\n                for question_id in expected_ids\n            )\n        )'''
          new_first_use = '''        self.assertTrue(\n            all(\n                next(entry for entry in inputs.id_registry if entry["question_id"] == question_id)["first_used_bank_revision"]\n                == (self.PRODUCTION_REVISION if int(question_id.rsplit("-", 1)[1]) <= 100 else self.CURRENT_PRODUCTION_REVISION)\n                for question_id in expected_ids\n            )\n        )'''
          if old_first_use not in method:
              raise SystemExit("expected production first-use assertion not found")
          method = method.replace(old_first_use, new_first_use, 1)
          method = method.replace('        self.assertNotIn("DRONE-Q-000101", question_ids)', '        self.assertIn("DRONE-Q-000101", question_ids)', 1)
          method = method.replace('''        self.assertEqual(\n            next(entry for entry in inputs.id_registry if entry["question_id"] == "DRONE-Q-000101")["first_used_bank_revision"],\n            "",\n        )''', '''        self.assertEqual(\n            next(entry for entry in inputs.id_registry if entry["question_id"] == "DRONE-Q-000101")["first_used_bank_revision"],\n            self.CURRENT_PRODUCTION_REVISION,\n        )''', 1)
          method = method.replace('runtime["bankRevision"], self.PRODUCTION_REVISION', 'runtime["bankRevision"], self.CURRENT_PRODUCTION_REVISION', 1)
          method = method.replace('self.assertEqual(runtime["contentAsOf"], "2026-08-19")', 'self.assertEqual(runtime["contentAsOf"], "2026-08-24")', 1)
          t = t[:start] + method + t[stop:]

          # The V0 formal snapshot remains an immutable 100-question historical contract.
          old_snapshot = '''        live_by_id = {\n            row["question_id"]: row\n            for row in live_rows\n            if row["status"] == "active"\n        }\n        snapshot_by_id = {row["question_id"]: row for row in snapshot_rows}\n        self.assertEqual(set(live_by_id), set(snapshot_by_id))'''
          new_snapshot = '''        snapshot_by_id = {row["question_id"]: row for row in snapshot_rows}\n        live_by_id = {\n            row["question_id"]: row\n            for row in live_rows\n            if row["question_id"] in snapshot_by_id\n        }\n        self.assertEqual(set(live_by_id), set(snapshot_by_id))'''
          if old_snapshot not in t:
              raise SystemExit("expected V0 formal-snapshot assertion not found")
          t = t.replace(old_snapshot, new_snapshot, 1)
          p.write_text(t, encoding="utf-8")
          PY

      - name: Run complete activation and repository gates
        shell: bash
        run: |
          python3 tooling/question_bank/validate.py --bank question_banks/drone_second_class --check-generated
          python3 tooling/question_bank/generate.py --bank question_banks/drone_second_class --check
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/drone_state.json
          python3 tooling/question_bank/tests/test_drone_release_activation_188.py
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'

      - name: Commit durable activation transition
        shell: bash
        run: |
          rm -f .github/drone-release-activation-188-trigger
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^question_banks/drone_second_class/validation/formal_snapshot/'; then
            echo 'Historical V0 formal snapshot mutation is prohibited' >&2
            exit 1
          fi
          git commit -m 'Activate Drone Production Bank 188'
          git push --force-with-lease origin HEAD:chatgpt/drone-release-activate-188
