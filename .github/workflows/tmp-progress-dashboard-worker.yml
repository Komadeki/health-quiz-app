name: Temporary Progress Dashboard Patch Worker

on:
  push:
    branches: [chatgpt/drone-progress-radar-metrics]

permissions:
  contents: write

concurrency:
  group: temporary-progress-dashboard-patch-worker
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-progress-radar-metrics
          fetch-depth: 0

      - name: Patch production dashboard and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          production = Path('packages/qualification_app/lib/src/production_app.dart')
          text = production.read_text()

          old = "import 'dart:async';\n\n"
          new = "import 'dart:async';\nimport 'dart:math' as math;\n\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected dart:async import anchor')
          text = text.replace(old, new, 1)

          old = "import 'production_purchase.dart';\n\n"
          new = "import 'production_purchase.dart';\n\npart 'progress_dashboard.dart';\n\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected production_purchase import anchor')
          text = text.replace(old, new, 1)

          start_marker = 'final class _ProgressCard extends StatelessWidget {'
          end_marker = 'final class _ProgressRing extends StatelessWidget {'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('progress card replacement anchors missing')
          replacement = '''final class _ProgressCard extends StatelessWidget {
            const _ProgressCard({required this.controller});

            final QualificationProductionController controller;

            @override
            Widget build(BuildContext context) =>
                _buildProgressDashboard(context, controller);
          }

          '''
          text = text[:start] + replacement + text[end:]

          old = '''    return Container(
                constraints: const BoxConstraints(minWidth: 92),
                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),'''
          new = '''    return Container(
                constraints: const BoxConstraints(minHeight: 96),
                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 10),'''
          if text.count(old) != 1:
              raise SystemExit('progress metric container anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''          Text(
                    value,
                    style: Theme.of(
                      context,
                    ).textTheme.titleMedium?.copyWith(fontWeight: FontWeight.w800),
                  ),
                  Text(label, style: Theme.of(context).textTheme.labelMedium),'''
          new = '''          Text(
                    value,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: Theme.of(
                      context,
                    ).textTheme.titleSmall?.copyWith(fontWeight: FontWeight.w800),
                  ),
                  Text(
                    label,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: Theme.of(context).textTheme.labelSmall,
                  ),'''
          if text.count(old) != 1:
              raise SystemExit('progress metric text anchor mismatch')
          text = text.replace(old, new, 1)
          production.write_text(text)

          dashboard = Path('packages/qualification_app/lib/src/progress_dashboard.dart')
          dashboard_text = dashboard.read_text()
          if dashboard_text.count('const _MetricDescriptor(') != 4:
              raise SystemExit('metric descriptor count mismatch')
          dashboard.write_text(
              dashboard_text.replace('const _MetricDescriptor(', '_MetricDescriptor(')
          )

          shared_test = Path('packages/qualification_app/test/production_widget_test.dart')
          test_text = shared_test.read_text()
          anchor = "    expect(find.byKey(const Key('overall-progress-ring')), findsOneWidget);\n"
          insert = anchor + """    expect(find.byKey(const Key('unit-performance-chart')), findsOneWidget);
              for (final metricKey in [
                'progress-metric-completed',
                'progress-metric-accuracy',
                'progress-metric-review',
                'progress-metric-mock-best',
              ]) {
                expect(find.byKey(Key(metricKey)), findsOneWidget);
              }
          """
          if test_text.count(anchor) != 1:
              raise SystemExit('shared dashboard assertion anchor mismatch')
          test_text = test_text.replace(anchor, insert, 1)

          test_anchor = "  testWidgets('actionable and informational Home cards use distinct colors', (\n"
          new_test = """  testWidgets('progress dashboard shows review count and best mock score', (
              tester,
            ) async {
              tester.view.physicalSize = const Size(800, 1800);
              tester.view.devicePixelRatio = 1;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);
              final controller = await createController(
                entitlement: EntitlementSnapshot(
                  ownedProductIds: const {'fixture_full_unlock'},
                ),
              );
              addTearDown(controller.dispose);

              await controller.startMockExam();
              while (controller.activeSession != null) {
                await controller.commitAnswer(controller.currentCard!.answerIndex);
                await controller.advance();
              }
              controller.returnHome();

              await controller.startUnit('fixture_safety');
              final card = controller.currentCard!;
              final wrongAnswer = (card.answerIndex + 1) % card.choices.length;
              await controller.commitAnswer(wrongAnswer);
              controller.returnHome();

              await tester.pumpWidget(
                QualificationProductionApp(
                  definition: fixtureDefinition,
                  controller: controller,
                ),
              );

              final review = find.byKey(const Key('progress-metric-review'));
              final mockBest = find.byKey(const Key('progress-metric-mock-best'));
              expect(
                find.descendant(of: review, matching: find.text('1問')),
                findsOneWidget,
              );
              expect(
                find.descendant(of: mockBest, matching: find.text('2/2')),
                findsOneWidget,
              );
            });

          """
          if test_text.count(test_anchor) != 1:
              raise SystemExit('shared new test insertion anchor mismatch')
          test_text = test_text.replace(test_anchor, new_test + test_anchor, 1)
          shared_test.write_text(test_text)

          drone_test = Path('apps/drone_second_class/test/production_widget_test.dart')
          drone_text = drone_test.read_text()
          drone_anchor = "    expect(find.byKey(const Key('overall-progress')), findsOneWidget);\n"
          drone_insert = drone_anchor + """    final performanceChart = find.byKey(const Key('unit-performance-chart'));
              expect(performanceChart, findsOneWidget);
              expect(
                find.descendant(of: performanceChart, matching: find.byType(CustomPaint)),
                findsOneWidget,
              );
              for (final metricKey in [
                'progress-metric-completed',
                'progress-metric-accuracy',
                'progress-metric-review',
                'progress-metric-mock-best',
              ]) {
                expect(find.byKey(Key(metricKey)), findsOneWidget);
              }
          """
          if drone_text.count(drone_anchor) != 1:
              raise SystemExit('drone dashboard assertion anchor mismatch')
          drone_test.write_text(drone_text.replace(drone_anchor, drone_insert, 1))
          PY

      - name: Format changed Dart files
        uses: dart-lang/setup-dart@v1

      - name: Run Dart formatter
        run: |
          dart format \
            packages/qualification_app/lib/src/production_app.dart \
            packages/qualification_app/lib/src/progress_dashboard.dart \
            packages/qualification_app/test/production_widget_test.dart \
            apps/drone_second_class/test/production_widget_test.dart

      - name: Commit patched implementation
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          rm -f .github/workflows/tmp-progress-dashboard-worker.yml
          git add -A
          git diff --cached --check
          git commit -m 'Improve progress dashboard with unit radar and study metrics'
          git push origin HEAD:chatgpt/drone-progress-radar-metrics
