name: B1 Rules Source Verification Repair

on:
  push:
    branches:
      - chatgpt/drone-b1-rules-source-verify-18-r1
    paths:
      - '.github/b1-rules-source-verification-repair-trigger'

permissions:
  contents: write

concurrency:
  group: b1-rules-source-verification-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger B1 Rules verification repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair stale verification regression and diff hygiene
        shell: bash
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          python3 - <<'PY'
          import json
          from pathlib import Path

          test = Path('tooling/question_bank/tests/test_expansion.py')
          text = test.read_text(encoding='utf-8')
          old = 'self.assertEqual({"INTEGRATED"}, {row["state"] for row in rows})'
          new = 'self.assertEqual({"VERIFIED"}, {row["state"] for row in rows})'
          if old not in text:
              raise SystemExit('expected stale INTEGRATED assertion not found')
          if text.count(old) != 1:
              raise SystemExit('stale assertion is not unique')
          test.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('question_banks/drone_second_class/authoring/source_verifications.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          rows = doc['verifications']
          ids = [row['question_id'] for row in rows]
          expected = [f'DRONE-Q-{n:06d}' for n in range(1, 189)]
          if ids != expected:
              raise SystemExit('source verification inventory/order mismatch')
          compact = '{"schema_version":1,"verifications":[\n' + ',\n'.join(
              json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in rows
          ) + '\n]}'
          path.write_text(compact, encoding='utf-8')
          PY
          git show origin/main:.github/workflows/b1-rules-source-verification-worker.yml > .github/workflows/b1-rules-source-verification-worker.yml
          rm .github/b1-rules-source-verification-repair-trigger
          git diff --check
          python3 tooling/question_bank/validate.py --bank question_banks/drone_second_class
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/drone_state.json
          python3 tooling/question_bank/tests/test_b1_source_verification.py
          python3 -m unittest tooling.question_bank.tests.test_expansion
          git add -A
          git diff --cached --check
          git commit -m 'Repair B1 verification regression'
          git push origin HEAD:chatgpt/drone-b1-rules-source-verify-18-r1
