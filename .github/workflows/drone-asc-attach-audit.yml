name: Drone App Store Attach Build Audit

on:
  push:
    branches:
      - chatgpt/drone-testflight-preview-current
    paths:
      - '.github/drone-asc-attach-audit-trigger'

permissions:
  contents: read

jobs:
  attach-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BUNDLE_ID: com.komadeki.dronesecondclass
      APP_VERSION: '1.0.1'
      BUILD_NUMBER: '202608261144'
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Attach RC build and audit submission readiness
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m pip install --quiet pyjwt cryptography
          export ASC_KEY_PATH="$KEY_PATH"
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, jwt
          with open(os.environ['ASC_KEY_PATH'], encoding='utf-8') as fh: private_key = fh.read()
          key_id=os.environ['APP_STORE_CONNECT_API_KEY_ID']; issuer_id=os.environ['APP_STORE_CONNECT_API_ISSUER_ID']
          bundle_id=os.environ['APP_BUNDLE_ID']; target_version=os.environ['APP_VERSION']; build_number=os.environ['BUILD_NUMBER']

          def token():
              now=int(time.time())
              return jwt.encode({'iss':issuer_id,'iat':now,'exp':now+900,'aud':'appstoreconnect-v1'}, private_key, algorithm='ES256', headers={'kid':key_id,'typ':'JWT'})
          def req(method,path,params=None,body=None,optional=False):
              url='https://api.appstoreconnect.apple.com'+path
              if params: url+='?'+urllib.parse.urlencode(params,doseq=True)
              data=None if body is None else json.dumps(body).encode()
              headers={'Authorization':'Bearer '+token()}
              if body is not None: headers['Content-Type']='application/json'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method=method),timeout=30) as r:
                      raw=r.read(); return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  if optional:
                      print(f'OPTIONAL_API_UNAVAILABLE={method} {path} HTTP {e.code}')
                      return None
                  print(f'HTTP {e.code} {method} {path}: {raw}',file=sys.stderr); raise

          apps=req('GET','/v1/apps',{'filter[bundleId]':bundle_id,'limit':1}); app=apps['data'][0]; app_id=app['id']
          builds=req('GET','/v1/builds',{'filter[app]':app_id,'filter[version]':build_number,'limit':10}); build=builds['data'][0]; build_id=build['id']
          ba=build.get('attributes',{}); print('BUILD_STATE='+str(ba.get('processingState'))); print('BUILD_EXPIRED='+str(ba.get('expired')))
          if ba.get('processingState')!='VALID' or ba.get('expired') is True: print('::error::Invalid RC build'); sys.exit(1)

          versions=req('GET',f'/v1/apps/{app_id}/appStoreVersions',{'limit':200}); version=None
          for item in versions.get('data',[]):
              a=item.get('attributes',{}); state=a.get('appVersionState') or a.get('appStoreState')
              print('VERSION='+str(a.get('versionString'))+' STATE='+str(state)+' ID='+item['id'])
              if a.get('versionString')==target_version: version=item
          if version is None: print('::error::Target version missing'); sys.exit(1)
          version_id=version['id']

          req('PATCH',f'/v1/appStoreVersions/{version_id}/relationships/build',body={'data':{'type':'builds','id':build_id}})
          attached=req('GET',f'/v1/appStoreVersions/{version_id}/build')
          attached_id=(attached or {}).get('data',{}).get('id') if (attached or {}).get('data') else None
          print('VERSION_BUILD_ATTACHED='+str(attached_id==build_id).lower())
          if attached_id!=build_id: print('::error::RC build attachment failed'); sys.exit(1)

          locs=req('GET',f'/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations',{'limit':200},optional=True)
          screenshot_total=0; loc_count=0
          if locs:
              for loc in locs.get('data',[]):
                  loc_count+=1; a=loc.get('attributes',{}); locale=str(a.get('locale'))
                  print('LOCALIZATION='+locale+' DESCRIPTION='+str(bool((a.get('description') or '').strip())).lower()+' KEYWORDS='+str(bool((a.get('keywords') or '').strip())).lower()+' SUPPORT_URL='+str(a.get('supportUrl')))
                  sets=req('GET',f"/v1/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets",{'limit':200},optional=True)
                  if sets:
                      for ss in sets.get('data',[]):
                          shots=req('GET',f"/v1/appScreenshotSets/{ss['id']}/appScreenshots",{'limit':200},optional=True); count=len(shots.get('data',[])) if shots else 0; screenshot_total+=count
                          print('SCREENSHOT_SET='+locale+':'+str(ss.get('attributes',{}).get('screenshotDisplayType'))+' COUNT='+str(count))
          print('LOCALIZATION_COUNT='+str(loc_count)); print('SCREENSHOT_TOTAL='+str(screenshot_total))

          review=req('GET',f'/v1/appStoreVersions/{version_id}/appStoreReviewDetail',optional=True)
          if review and review.get('data'):
              a=review['data'].get('attributes',{}); print('REVIEW_DETAIL_EXISTS=true'); print('REVIEW_EMAIL_PRESENT='+str(bool((a.get('contactEmail') or '').strip())).lower()); print('REVIEW_PHONE_PRESENT='+str(bool((a.get('contactPhone') or '').strip())).lower()); print('REVIEW_DEMO_REQUIRED='+str(a.get('demoAccountRequired')))
          else: print('REVIEW_DETAIL_EXISTS=false')

          infos=req('GET',f'/v1/apps/{app_id}/appInfos',{'limit':50},optional=True)
          if infos:
              for info in infos.get('data',[]):
                  a=info.get('attributes',{}); print('APP_INFO_STATE='+str(a.get('state') or a.get('appStoreState'))+' ID='+info['id'])
                  ilocs=req('GET',f"/v1/appInfos/{info['id']}/appInfoLocalizations",{'limit':200},optional=True)
                  if ilocs:
                      for iloc in ilocs.get('data',[]):
                          a=iloc.get('attributes',{}); print('APP_INFO_LOCALIZATION='+str(a.get('locale'))+' PRIVACY_URL='+str(a.get('privacyPolicyUrl')))

          iaps=req('GET',f'/v1/apps/{app_id}/inAppPurchasesV2',{'limit':200},optional=True)
          if iaps:
              for iap in iaps.get('data',[]):
                  a=iap.get('attributes',{}); print('IAP_PRODUCT_ID='+str(a.get('productId'))+' TYPE='+str(a.get('inAppPurchaseType'))+' STATE='+str(a.get('state')))

          submissions=req('GET',f'/v1/apps/{app_id}/reviewSubmissions',{'limit':50},optional=True)
          if submissions:
              for sub in submissions.get('data',[]): print('REVIEW_SUBMISSION_STATE='+str(sub.get('attributes',{}).get('state'))+' ID='+sub['id'])
          PY
