name: B4 Operations Source Verification Worker

on:
  push:
    branches:
      - chatgpt/drone-b4-operations-source-verify-19-r1
    paths:
      - '.github/b4-operations-source-verification-trigger'
  pull_request:
    branches:
      - main
    paths:
      - '.github/b4-operations-source-verification-trigger'

permissions:
  contents: write

concurrency:
  group: b4-operations-source-verification-worker
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Trigger B4 Operations source verification worker') ||
      (github.event_name == 'pull_request' && github.head_ref == 'chatgpt/drone-b4-operations-source-verify-19-r1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-b4-operations-source-verify-19-r1
          fetch-depth: 0
      - name: Reconcile to current main
        shell: bash
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Apply B4 source verification
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import csv, json, subprocess, sys
          from pathlib import Path

          repo = Path.cwd()
          tool_dir = repo / "tooling" / "question_bank"
          sys.path.insert(0, str(tool_dir))
          from expansion import validate_expansion_batch

          bank = repo / "question_banks" / "drone_second_class"
          authoring = bank / "authoring"
          batch = authoring / "batches" / "batch_004"
          state_path = repo / "tooling" / "komadeki_autopilot" / "drone_state.json"
          accepted = (
              "B4-OPS-C001","B4-OPS-C002","B4-OPS-C003","B4-OPS-C004","B4-OPS-C005",
              "B4-OPS-C006","B4-OPS-C007","B4-OPS-C008","B4-OPS-C009","B4-OPS-C010",
              "B4-OPS-C011","B4-OPS-C012","B4-OPS-C013","B4-OPS-C014","B4-OPS-C015",
              "B4-OPS-C017","B4-OPS-C018","B4-OPS-C019","B4-OPS-C020",
          )
          mapping = {cid: f"DRONE-Q-{n:06d}" for cid, n in zip(accepted, range(170, 189))}

          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("next_atomic_objective") != "VERIFY_B4_OPERATIONS_CANONICAL_SOURCES_19" or state.get("state_epoch") != 21:
              raise SystemExit(f"unexpected state: {state.get('state_epoch')} / {state.get('next_atomic_objective')}")

          with (batch / "candidates.csv").open(encoding="utf-8", newline="") as h:
              reader = csv.DictReader(h); fields = list(reader.fieldnames or []); rows = list(reader)
          by_id = {r["candidate_id"]: r for r in rows}
          for cid, qid in mapping.items():
              r = by_id[cid]
              if r["state"] != "INTEGRATED" or r["permanent_question_id"] != qid:
                  raise SystemExit(f"integration binding mismatch: {cid}")
              if r["source_id"] != "MLIT-UAS-SAFETY-GUIDE-5" or r["source_version"] != "5" or "教則 第5章" not in r["source_locator"] or "〔一等〕" in r["source_locator"]:
                  raise SystemExit(f"source contract mismatch: {cid}")
          rejected = by_id["B4-OPS-C016"]
          if rejected["state"] != "AI_PRE_ACCEPT" or rejected["permanent_question_id"]:
              raise SystemExit("C016 rejection invariant violated")

          with (authoring / "questions.csv").open(encoding="utf-8", newline="") as h:
              questions = {r["question_id"]: r for r in csv.DictReader(h)}
          if len(questions) != 188:
              raise SystemExit(f"canonical inventory expected 188, got {len(questions)}")
          for cid, qid in mapping.items():
              q = questions[qid]; c = by_id[cid]
              if q["status"] != "draft" or q["unit_id"] != "drone_operations" or q["question"] != c["question"] or q["correct_choice"] != c["proposed_correct"] or q["source_id"] != c["source_id"] or q["source_locator"] != c["source_locator"]:
                  raise SystemExit(f"canonical binding mismatch: {qid}")

          sources = json.loads((authoring / "sources.json").read_text(encoding="utf-8"))["sources"]
          source = next(s for s in sources if s["source_id"] == "MLIT-UAS-SAFETY-GUIDE-5")
          if str(source["source_version"]) != "5":
              raise SystemExit("unexpected current source version")

          verification_path = authoring / "source_verifications.json"
          verification_doc = json.loads(verification_path.read_text(encoding="utf-8"))
          existing = {r["question_id"] for r in verification_doc["verifications"]}
          if any(qid in existing for qid in mapping.values()):
              raise SystemExit("partial/duplicate B4 source verification detected")
          verification_doc["verifications"].extend({
              "question_id": qid,
              "source_id": "MLIT-UAS-SAFETY-GUIDE-5",
              "source_version": "5",
              "verification_state": "author_source_verified",
              "verified_at": "2026-08-24",
          } for qid in mapping.values())
          verification_doc["verifications"].sort(key=lambda r: r["question_id"])
          verification_path.write_text(json.dumps(verification_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for cid in accepted:
              by_id[cid]["state"] = "VERIFIED"
          with (batch / "candidates.csv").open("w", encoding="utf-8", newline="") as h:
              w = csv.DictWriter(h, fieldnames=fields, lineterminator="\n"); w.writeheader(); w.writerows(rows)

          observed_main = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          state["observed_main"] = observed_main
          state["next_atomic_objective"] = "REVIEW_PRODUCTION_BANK_TARGET_AT_188"
          state["state_epoch"] = 22
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          errors = validate_expansion_batch(batch)
          if errors: raise SystemExit(" | ".join(errors))

          test_path = tool_dir / "tests" / "test_b4_source_verification.py"
          test_path.write_text('''from __future__ import annotations\nimport csv,json,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[3]\nA=ROOT/"question_banks/drone_second_class/authoring"\nB=A/"batches/batch_004"\nIDS=[f"DRONE-Q-{n:06d}" for n in range(170,189)]\nACCEPTED={"B4-OPS-C001","B4-OPS-C002","B4-OPS-C003","B4-OPS-C004","B4-OPS-C005","B4-OPS-C006","B4-OPS-C007","B4-OPS-C008","B4-OPS-C009","B4-OPS-C010","B4-OPS-C011","B4-OPS-C012","B4-OPS-C013","B4-OPS-C014","B4-OPS-C015","B4-OPS-C017","B4-OPS-C018","B4-OPS-C019","B4-OPS-C020"}\nclass T(unittest.TestCase):\n def test_verified(self):\n  with (B/"candidates.csv").open(encoding="utf-8",newline="") as h: rows={r["candidate_id"]:r for r in csv.DictReader(h)}\n  self.assertTrue(all(rows[c]["state"]=="VERIFIED" for c in ACCEPTED)); self.assertEqual("AI_PRE_ACCEPT",rows["B4-OPS-C016"]["state"]); self.assertEqual("",rows["B4-OPS-C016"]["permanent_question_id"])\n  v=json.loads((A/"source_verifications.json").read_text(encoding="utf-8"))["verifications"]; by={r["question_id"]:r for r in v}\n  for q in IDS:\n   self.assertEqual("author_source_verified",by[q]["verification_state"]); self.assertEqual("5",by[q]["source_version"]); self.assertEqual("2026-08-24",by[q]["verified_at"])\n  released=json.loads((A/"released_questions.json").read_text(encoding="utf-8"))["released_questions"]; self.assertEqual(100,len(released))\nif __name__=="__main__": unittest.main()\n''', encoding="utf-8")
          PY
      - name: Validate and test
        shell: bash
        run: |
          python3 tooling/question_bank/validate.py --bank question_banks/drone_second_class
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/drone_state.json
          python3 tooling/question_bank/tests/test_b4_source_verification.py
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'
      - name: Commit durable transition
        shell: bash
        run: |
          rm -f .github/b4-operations-source-verification-trigger
          git add -A
          git diff --cached --check
          git commit -m 'Verify B4 Operations canonical sources'
          git push --force-with-lease origin HEAD:chatgpt/drone-b4-operations-source-verify-19-r1
