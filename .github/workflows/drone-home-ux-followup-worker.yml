name: Drone Home UX Follow-up Worker

on:
  push:
    branches:
      - chatgpt/drone-home-ux-followup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-home-ux-followup
          fetch-depth: 0

      - name: Apply targeted UI UX changes
        run: python3 .github/scripts/drone_home_ux_followup.py

      - name: Validate patch
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/drone_home_ux_followup.py
          rm .github/workflows/drone-home-ux-followup-worker.yml
          git config user.name "SABRmetricsDev"
          git config user.email "100670593+Komadeki@users.noreply.github.com"
          git add packages/qualification_app/lib/src/production_app.dart \
                  packages/qualification_app/lib/src/progress_dashboard.dart \
                  packages/qualification_app/test/production_widget_test.dart \
                  packages/qualification_app/test/home_primary_action_test.dart \
                  .github/scripts/drone_home_ux_followup.py \
                  .github/workflows/drone-home-ux-followup-worker.yml
          git commit -m "Polish Drone Home UX follow-up"
          git push origin HEAD:chatgpt/drone-home-ux-followup
