name: Drone App Store Release Audit

on:
  push:
    branches:
      - chatgpt/drone-testflight-preview-current
    paths:
      - '.github/drone-asc-release-audit-trigger'

permissions:
  contents: read

concurrency:
  group: drone-asc-release-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BUNDLE_ID: com.komadeki.dronesecondclass
      APP_VERSION: '1.0.1'
      BUILD_NUMBER: '202608261144'
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Validate App Store Connect credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 78
            fi
          done

      - name: Audit Drone App Store Connect release state
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 -m pip install --quiet pyjwt cryptography
          export ASC_KEY_PATH="$KEY_PATH"
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          key_id = os.environ['APP_STORE_CONNECT_API_KEY_ID']
          issuer_id = os.environ['APP_STORE_CONNECT_API_ISSUER_ID']
          bundle_id = os.environ['APP_BUNDLE_ID']
          app_version = os.environ['APP_VERSION']
          build_number = os.environ['BUILD_NUMBER']
          with open(os.environ['ASC_KEY_PATH'], 'r', encoding='utf-8') as fh:
              private_key = fh.read()

          def token():
              now = int(time.time())
              return jwt.encode(
                  {'iss': issuer_id, 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
                  private_key,
                  algorithm='ES256',
                  headers={'kid': key_id, 'typ': 'JWT'},
              )

          def get(path, params=None, optional=False):
              url = 'https://api.appstoreconnect.apple.com' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token()})
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      return json.load(res)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  if optional:
                      print(f'OPTIONAL_API_UNAVAILABLE={path} HTTP {exc.code}')
                      return None
                  print(f'HTTP {exc.code} for {path}: {body}', file=sys.stderr)
                  raise

          apps = get('/v1/apps', {'filter[bundleId]': bundle_id, 'limit': '1'})
          if not apps.get('data'):
              print(f'::error::App not found for bundle ID {bundle_id}')
              sys.exit(1)
          app = apps['data'][0]
          app_id = app['id']
          print('APP_ID=' + app_id)
          print('APP_NAME=' + str(app.get('attributes', {}).get('name')))
          print('BUNDLE_ID=' + bundle_id)

          builds = get('/v1/builds', {
              'filter[app]': app_id,
              'filter[version]': build_number,
              'limit': '10',
          })
          if not builds.get('data'):
              print(f'::error::Release build {build_number} is not visible in App Store Connect')
              sys.exit(1)
          build = builds['data'][0]
          build_id = build['id']
          battrs = build.get('attributes', {})
          print('BUILD_ID=' + build_id)
          print('BUILD_NUMBER=' + str(battrs.get('version')))
          print('BUILD_PROCESSING_STATE=' + str(battrs.get('processingState')))
          print('BUILD_EXPIRED=' + str(battrs.get('expired')))
          print('BUILD_USES_NON_EXEMPT_ENCRYPTION=' + str(battrs.get('usesNonExemptEncryption')))
          if battrs.get('processingState') != 'VALID' or battrs.get('expired') is True:
              print('::error::Release build is not a valid non-expired candidate')
              sys.exit(1)

          beta = get(f'/v1/builds/{build_id}/buildBetaDetail', optional=True)
          if beta and beta.get('data'):
              attrs = beta['data'].get('attributes', {})
              print('TESTFLIGHT_INTERNAL_STATE=' + str(attrs.get('internalBuildState')))
              print('TESTFLIGHT_EXTERNAL_STATE=' + str(attrs.get('externalBuildState')))

          versions = get('/v1/appStoreVersions', {
              'filter[app]': app_id,
              'filter[platform]': 'IOS',
              'limit': '200',
          })
          target = None
          print('APP_STORE_VERSIONS_BEGIN')
          for item in versions.get('data', []):
              attrs = item.get('attributes', {})
              print('VERSION=' + str(attrs.get('versionString')) + ' STATE=' + str(attrs.get('appStoreState')) + ' ID=' + item['id'])
              if attrs.get('versionString') == app_version:
                  target = item
          print('APP_STORE_VERSIONS_END')
          if target is None:
              print('TARGET_VERSION_EXISTS=false')
              sys.exit(0)

          version_id = target['id']
          vattrs = target.get('attributes', {})
          print('TARGET_VERSION_EXISTS=true')
          print('TARGET_VERSION_ID=' + version_id)
          print('TARGET_VERSION_STATE=' + str(vattrs.get('appStoreState')))
          print('TARGET_RELEASE_TYPE=' + str(vattrs.get('releaseType')))

          attached = get(f'/v1/appStoreVersions/{version_id}/build', optional=True)
          if attached and attached.get('data'):
              attached_id = attached['data']['id']
              print('VERSION_BUILD_ATTACHED=true')
              print('VERSION_BUILD_ID=' + attached_id)
              print('VERSION_BUILD_MATCHES_RC=' + str(attached_id == build_id).lower())
          else:
              print('VERSION_BUILD_ATTACHED=false')

          locs = get(f'/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations', {'limit': '200'}, optional=True)
          loc_count = 0
          screenshot_total = 0
          if locs:
              for loc in locs.get('data', []):
                  loc_count += 1
                  attrs = loc.get('attributes', {})
                  locale = attrs.get('locale')
                  print('LOCALIZATION=' + str(locale)
                        + ' DESCRIPTION=' + str(bool((attrs.get('description') or '').strip())).lower()
                        + ' KEYWORDS=' + str(bool((attrs.get('keywords') or '').strip())).lower()
                        + ' SUPPORT_URL=' + str(bool((attrs.get('supportUrl') or '').strip())).lower()
                        + ' WHATS_NEW=' + str(bool((attrs.get('whatsNew') or '').strip())).lower())
                  sets = get(f"/v1/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets", {'limit': '200'}, optional=True)
                  if sets:
                      for shot_set in sets.get('data', []):
                          shots = get(f"/v1/appScreenshotSets/{shot_set['id']}/appScreenshots", {'limit': '200'}, optional=True)
                          count = len(shots.get('data', [])) if shots else 0
                          screenshot_total += count
                          dtype = shot_set.get('attributes', {}).get('screenshotDisplayType')
                          print(f'SCREENSHOT_SET={locale}:{dtype} COUNT={count}')
          print('LOCALIZATION_COUNT=' + str(loc_count))
          print('SCREENSHOT_TOTAL=' + str(screenshot_total))

          review = get(f'/v1/appStoreVersions/{version_id}/appStoreReviewDetail', optional=True)
          if review and review.get('data'):
              attrs = review['data'].get('attributes', {})
              print('REVIEW_DETAIL_EXISTS=true')
              print('REVIEW_CONTACT_EMAIL_PRESENT=' + str(bool((attrs.get('contactEmail') or '').strip())).lower())
              print('REVIEW_CONTACT_PHONE_PRESENT=' + str(bool((attrs.get('contactPhone') or '').strip())).lower())
              print('REVIEW_DEMO_REQUIRED=' + str(attrs.get('demoAccountRequired')))
          else:
              print('REVIEW_DETAIL_EXISTS=false')

          infos = get(f'/v1/apps/{app_id}/appInfos', {'limit': '50'}, optional=True)
          if infos:
              print('APP_INFO_COUNT=' + str(len(infos.get('data', []))))
              for info in infos.get('data', []):
                  attrs = info.get('attributes', {})
                  print('APP_INFO_STATE=' + str(attrs.get('appStoreState')) + ' ID=' + info['id'])
                  ilocs = get(f"/v1/appInfos/{info['id']}/appInfoLocalizations", {'limit': '200'}, optional=True)
                  if ilocs:
                      for iloc in ilocs.get('data', []):
                          ia = iloc.get('attributes', {})
                          print('APP_INFO_LOCALIZATION=' + str(ia.get('locale'))
                                + ' PRIVACY_URL=' + str(bool((ia.get('privacyPolicyUrl') or '').strip())).lower()
                                + ' SUBTITLE=' + str(bool((ia.get('subtitle') or '').strip())).lower())

          iaps = get(f'/v1/apps/{app_id}/inAppPurchasesV2', {'limit': '200'}, optional=True)
          if iaps:
              print('IAP_BEGIN')
              for iap in iaps.get('data', []):
                  attrs = iap.get('attributes', {})
                  print('IAP_PRODUCT_ID=' + str(attrs.get('productId'))
                        + ' TYPE=' + str(attrs.get('inAppPurchaseType'))
                        + ' STATE=' + str(attrs.get('state')))
              print('IAP_END')
          PY
