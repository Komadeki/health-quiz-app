name: Otsu4 B2 Integration PR Worker

on:
  pull_request:
    branches: [main]
    paths: ['.github/otsu4-b2-integration-trigger']

permissions:
  contents: write

concurrency:
  group: otsu4-b2-integration-pr-worker
  cancel-in-progress: false

jobs:
  integrate:
    if: github.head_ref == 'chatgpt/otsu4-b2-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/otsu4-b2-integration
          fetch-depth: 0
      - name: Reconcile to current main
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Allocate and integrate Otsu4 Batch 2 candidates
        run: python3 tooling/komadeki_autopilot/otsu4_b2_integration_transition.py
      - name: Validate integration and repository gates
        run: |
          python3 tooling/question_bank/tests/test_transaction.py
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'
          python3 tooling/question_bank/validate.py --bank question_banks/otsu4 --check-generated
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/otsu4_state.json
      - name: Commit durable Otsu4 Batch 2 integration transition
        run: |
          rm -f .github/otsu4-b2-integration-trigger
          git add -A
          git diff --cached --check
          git commit -m 'Integrate Otsu4 Batch 2 accepted drafts'
          git push --force-with-lease origin HEAD:chatgpt/otsu4-b2-integration
