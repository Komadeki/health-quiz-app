name: Temporary Progress Test Reachability Worker

on:
  push:
    branches: [chatgpt/drone-progress-radar-metrics]

permissions:
  contents: write

concurrency:
  group: temporary-progress-test-reachability-worker
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-progress-radar-metrics
          fetch-depth: 0

      - name: Make existing unit interaction test robust to taller dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/qualification_app/test/production_widget_test.dart')
          text = path.read_text()
          old = '''    final unit = find.byKey(const Key('unit-fixture_safety'));
              await tester.scrollUntilVisible(unit, 160);
              await tester.tap(unit);
              await tester.pump();
              final correctIndex = controller.currentCard!.answerIndex;'''
          new = '''    final unit = find.byKey(const Key('unit-fixture_safety'));
              await tester.scrollUntilVisible(unit, 200);
              await tester.ensureVisible(unit);
              await tester.pumpAndSettle();
              await tester.tap(unit);
              await tester.pump();
              final correctIndex = controller.currentCard!.answerIndex;'''
          if text.count(old) != 1:
              raise SystemExit('answer interaction test anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and self-delete worker
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          rm -f .github/workflows/tmp-progress-dashboard-test-reachability.yml
          git add -A
          git diff --cached --check
          git commit -m 'Keep answer interaction reachable after dashboard expansion'
          git push origin HEAD:chatgpt/drone-progress-radar-metrics
