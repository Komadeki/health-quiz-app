name: Google Play Recovery Debug APK

on:
  push:
    branches:
      - ops/google-play-recovery-debug-apk-20261012

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve health app dependencies
        working-directory: apps/health
        run: flutter pub get
      - name: Build Android prod-flavor debug APK (not signed for production)
        working-directory: apps/health
        run: flutter build apk --debug --flavor prod
      - name: Verify artifact exists and hash
        working-directory: apps/health
        run: |
          test -s build/app/outputs/flutter-apk/app-prod-debug.apk
          unzip -tqq build/app/outputs/flutter-apk/app-prod-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-prod-debug.apk
      - name: Upload APK for Play internal app sharing
        uses: actions/upload-artifact@v4
        with:
          name: mokeke-health-internal-sharing-debug-apk
          path: apps/health/build/app/outputs/flutter-apk/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14
