name: Drone 386 Release Activation PR Worker

on:
  pull_request:
    branches: [main]
    paths: ['.github/drone-release-386-activation-trigger']

permissions:
  contents: write

concurrency:
  group: drone-release-386-activation-pr-worker
  cancel-in-progress: false

jobs:
  activate:
    if: github.head_ref == 'chatgpt/drone-release-386-activate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/drone-release-386-activate
          fetch-depth: 0
      - name: Reconcile to current main
        run: |
          git config user.name "KOMADEKI Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Preserve historical released snapshot prefix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tooling/komadeki_autopilot/drone_release_activation_386_transition.py')
          text = path.read_text(encoding='utf-8')
          old = '''inputs = load_bank_inputs(BANK)
          released_doc = build_released_questions_document(inputs)
          released_after = released_doc.get("released_questions", [])
          if len(released_after) != 386 or [x["question_id"] for x in released_after] != list(ALL): fail("staged released snapshot drift")
          if released_after[:188] != released_before: fail("historical release prefix changed")
          released_path.write_bytes(pretty_json_bytes(released_doc))
          '''
          new = '''inputs = load_bank_inputs(BANK)
          released_doc = build_released_questions_document(inputs)
          generated_rows = released_doc.get("released_questions", [])
          if len(generated_rows) != 386 or [x["question_id"] for x in generated_rows] != list(ALL): fail("staged generated release snapshot drift")
          generated_by_id = {row["question_id"]: row for row in generated_rows}
          released_doc["released_questions"] = released_before + [generated_by_id[qid] for qid in NEW]
          released_after = released_doc["released_questions"]
          if len(released_after) != 386 or [x["question_id"] for x in released_after] != list(ALL): fail("staged released snapshot drift")
          if released_after[:188] != released_before: fail("historical release prefix changed")
          released_path.write_bytes(pretty_json_bytes(released_doc))
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one historical-prefix block to patch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Execute frozen 386 release activation
        run: python3 tooling/komadeki_autopilot/drone_release_activation_386_transition.py
      - name: Validate release and repository gates
        run: |
          python3 -m unittest discover -s tooling/question_bank/tests -p 'test_*.py'
          python3 tooling/question_bank/validate.py --bank question_banks/drone_second_class --check-generated
          python3 tooling/komadeki_autopilot/validate_state.py tooling/komadeki_autopilot/drone_state.json
      - name: Commit durable 386 release activation
        run: |
          rm -f .github/drone-release-386-activation-trigger
          git add -A
          git diff --cached --check
          git commit -m 'Activate Drone 386-question production bank'
          git push --force-with-lease origin HEAD:chatgpt/drone-release-386-activate
