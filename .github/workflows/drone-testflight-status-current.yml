name: Drone TestFlight Status Current

on:
  push:
    branches:
      - chatgpt/drone-testflight-preview-current
    paths:
      - '.github/testflight-status-current-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drone-testflight-status-current
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_BUNDLE_ID: com.komadeki.dronesecondclass
      BUILD_NUMBER: '202608250843'
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Validate App Store Connect credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 78
            fi
          done

      - name: Prepare API key and JWT support
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          python3 -m pip install --quiet pyjwt cryptography

      - name: Wait for TestFlight processing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import jwt

          key_id = os.environ['APP_STORE_CONNECT_API_KEY_ID']
          issuer_id = os.environ['APP_STORE_CONNECT_API_ISSUER_ID']
          key_path = os.environ['ASC_KEY_PATH']
          bundle_id = os.environ['APP_BUNDLE_ID']
          build_number = os.environ['BUILD_NUMBER']

          with open(key_path, 'r', encoding='utf-8') as fh:
              private_key = fh.read()

          def token():
              now = int(time.time())
              return jwt.encode(
                  {'iss': issuer_id, 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
                  private_key,
                  algorithm='ES256',
                  headers={'kid': key_id, 'typ': 'JWT'},
              )

          def get(path, params=None):
              url = 'https://api.appstoreconnect.apple.com' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token()})
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      return json.load(res)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  print(f'HTTP {exc.code} for {url}: {body}', file=sys.stderr)
                  raise

          apps = get('/v1/apps', {'filter[bundleId]': bundle_id, 'limit': '1'})
          if not apps.get('data'):
              print(f'::error::App not found for bundle ID {bundle_id}')
              sys.exit(1)
          app_id = apps['data'][0]['id']
          app_name = apps['data'][0].get('attributes', {}).get('name', bundle_id)
          print(f'App Store Connect app: {app_name} ({app_id})')

          build = None
          for attempt in range(41):
              builds = get(
                  '/v1/builds',
                  {
                      'filter[app]': app_id,
                      'filter[version]': build_number,
                      'fields[builds]': 'version,uploadedDate,processingState,expired,usesNonExemptEncryption',
                      'limit': '10',
                  },
              )
              data = builds.get('data', [])
              if data:
                  build = data[0]
                  state = build.get('attributes', {}).get('processingState')
                  print(f'Attempt {attempt + 1}: build {build_number} processingState={state}')
                  if state != 'PROCESSING':
                      break
              else:
                  print(f'Attempt {attempt + 1}: build {build_number} not visible yet')
              time.sleep(30)

          if build is None:
              print(f'::error::Build {build_number} did not appear in App Store Connect within the polling window')
              sys.exit(1)

          attrs = build.get('attributes', {})
          state = attrs.get('processingState')
          print('BUILD_ID=' + build['id'])
          print('BUILD_VERSION=' + str(attrs.get('version')))
          print('UPLOADED_DATE=' + str(attrs.get('uploadedDate')))
          print('PROCESSING_STATE=' + str(state))
          print('EXPIRED=' + str(attrs.get('expired')))
          print('USES_NON_EXEMPT_ENCRYPTION=' + str(attrs.get('usesNonExemptEncryption')))

          if state == 'PROCESSING':
              print('::error::Build is still processing after the polling window')
              sys.exit(1)
          if state != 'VALID':
              print(f'::error::Build processing did not succeed: {state}')
              sys.exit(1)

          detail = get(
              f"/v1/builds/{build['id']}/buildBetaDetail",
              {'fields[buildBetaDetails]': 'internalBuildState,externalBuildState,autoNotifyEnabled'},
          )
          detail_attrs = detail.get('data', {}).get('attributes', {})
          print('INTERNAL_BUILD_STATE=' + str(detail_attrs.get('internalBuildState')))
          print('EXTERNAL_BUILD_STATE=' + str(detail_attrs.get('externalBuildState')))
          print('AUTO_NOTIFY_ENABLED=' + str(detail_attrs.get('autoNotifyEnabled')))
          PY
